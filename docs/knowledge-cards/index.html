 $y$-axis gives $2\\sin x$, but along the $x$-axis gives $\\sin\\frac{x}{2}$.", "sources": [{"page": "Page049", "printed": "3.49", "where": "example"}, {"page": "Page053", "printed": "3.53", "where": "example"}, {"page": "Page053", "printed": "3.53", "where": "margin note"}, {"page": "Page068", "printed": "3.68", "where": "summary"}, {"page": "Page102", "printed": "T3.92j", "where": "example"}], "teacherOnly": false, "nonFoundation": true, "inSummary": true, "inferred": "The book shows the reciprocal in the margin working on P.3.53 and sets $kf(x)$ and $f(kx)$ side by side in the summary table on P.3.68. Putting the comparison into one sentence is ours.", "keyIdea": "K3-11", "level": "core", "parent": "S5C3-100", "role": "warning", "short": "$kf(x)$ versus $f(kx)$", "treeOrder": 70}, {"id": "S5C3-104", "section": "3.4 C", "sectionTitle": "Transformations of Functions", "kind": "property", "title": "Enlargement or reduction may change intercepts", "statement": "After the graph of a function is enlarged or reduced, its $x$-intercept(s) and its $y$-intercept may be changed. Which of them change depends on whether the enlargement or reduction is along the $y$-axis or along the $x$-axis.", "sources": [{"page": "Page054", "printed": "3.54", "where": "note"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "keyIdea": "K3-10", "level": "supporting", "hidden": true, "hiddenWhy": "A lead-in that the four intercept cards after it carry in full."}, {"id": "S5C3-105", "section": "3.4 C", "sectionTitle": "Transformations of Functions", "kind": "property", "title": "$x$-intercepts unchanged", "statement": "When the graph of $y = f(x)$ is enlarged to $k$ times ($k > 1$) the original, or reduced to $k$ ($0 < k < 1$) of the original, along the $y$-axis, the $x$-intercepts remain unchanged.", "example": "$y = \\sin x$, $y = 2\\sin x$ and $y = \\frac{1}{2}\\sin x$ all cut the $x$-axis at $0^\\circ$, $180^\\circ$ and $360^\\circ$.", "sources": [{"page": "Page048", "printed": "3.48", "where": "example"}, {"page": "Page049", "printed": "3.49", "where": "example"}, {"page": "Page054", "printed": "3.54", "where": "note"}, {"page": "Page102", "printed": "T3.92j", "where": "example"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "inferred": "The table on P.3.54 names the transformation in words; by the table on P.3.68 it gives $y=kf(x)$. The reason (points on the $x$-axis have $y$-coordinate 0, and $k\\times 0=0$, so they do not move) is our reading of the figures on P.3.46 to 3.48.", "keyIdea": "K3-10", "level": "core", "parent": "S5C3-093", "role": "graph", "short": "$x$-intercepts unchanged", "treeOrder": 65}, {"id": "S5C3-106", "section": "3.4 C", "sectionTitle": "Transformations of Functions", "kind": "property", "title": "$y$-intercept multiplied by $k$", "statement": "When the graph of $y = f(x)$ is enlarged to $k$ times ($k > 1$) the original, or reduced to $k$ ($0 < k < 1$) of the original, along the $y$-axis, the $y$-intercept also becomes $k$ times the original.", "example": "$g(x) = \\frac{1}{2}f(x)$ and the $y$-intercept of $y = f(x)$ is 6: the $y$-intercept of $y = g(x)$ is 3.", "sources": [{"page": "Page054", "printed": "3.54", "where": "note"}, {"page": "Page102", "printed": "T3.92j", "where": "example"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "inferred": "By the table on P.3.68 this transformation gives $y = kf(x)$.", "keyIdea": "K3-10", "level": "supporting", "parent": "S5C3-093", "role": "graph", "short": "$y$-intercept times $k$", "treeOrder": 66}, {"id": "S5C3-107", "section": "3.4 C", "sectionTitle": "Transformations of Functions", "kind": "property", "title": "$x$-intercepts multiplied by $\\frac{1}{k}$", "statement": "When the graph of $y = f(x)$ is enlarged or reduced along the $x$-axis to become the graph of $y = f(kx)$, each $x$-intercept is multiplied by $\\frac{1}{k}$.", "example": "$y = f(x)$ has $x$-intercepts $-6$ and 12, so $y = f(6x)$ has $x$-intercepts $-1$ and 2.", "figure": "Example 16 Diagram Clue: a U-shaped graph $y = f(x)$ crosses the $x$-axis at $-6$ and $12$ and the $y$-axis at $-8$. Reducing it to $\\frac{1}{6}$ of the original along the $x$-axis gives a narrower U-shaped graph $y = f(6x)$ that crosses the $x$-axis at $\\frac{1}{6}(-6)$ and $\\frac{1}{6}(12)$ and still crosses the $y$-axis at $-8$.", "sources": [{"page": "Page054", "printed": "3.54", "where": "example"}, {"page": "Page054", "printed": "3.54", "where": "note"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "keyIdea": "K3-11", "level": "core", "parent": "S5C3-098", "role": "graph", "short": "$x$-intercepts times $\\frac{1}{k}$", "treeOrder": 73}, {"id": "S5C3-108", "section": "3.4 C", "sectionTitle": "Transformations of Functions", "kind": "property", "title": "$y$-intercept unchanged", "statement": "When the graph of $y = f(x)$ is enlarged or reduced along the $x$-axis to become the graph of $y = f(kx)$, the $y$-intercept remains unchanged, because $f(k \\times 0) = f(0)$.", "sources": [{"page": "Page050", "printed": "3.50", "where": "main text"}, {"page": "Page051", "printed": "3.51", "where": "main text"}, {"page": "Page052", "printed": "3.52", "where": "example"}, {"page": "Page054", "printed": "3.54", "where": "example"}, {"page": "Page054", "printed": "3.54", "where": "note"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "keyIdea": "K3-11", "level": "supporting", "parent": "S5C3-098", "role": "graph", "short": "$y$-intercept unchanged", "treeOrder": 74}, {"id": "S5C3-109", "section": "3.4 D", "sectionTitle": "Transformations of Functions", "kind": "method-idea", "title": "Reading two transformations from $g(x)$", "statement": "When $g(x)$ is formed from $f(x)$ by two changes, each change gives one transformation. In $f(x - 2) + 4$, replacing $x$ by $x - 2$ translates the graph to the right by 2 units, and adding 4 translates it upwards by 4 units.", "example": "$f(3x) - 1$: reduce to $\\frac{1}{3}$ of the original along the $x$-axis, and translate downwards by 1 unit.", "figure": "Example 17(a): a U-shaped graph $y = f(x)$ is first moved 2 units to the right to give $y = f(x - 2)$, and this is then moved 4 units up to give $y = f(x - 2) + 4$.", "sources": [{"page": "Page056", "printed": "3.56", "where": "example"}, {"page": "Page102", "printed": "T3.92j", "where": "example"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "keyIdea": "K3-12", "level": "core", "parent": null, "role": null, "short": "One change, one transformation", "treeOrder": 75}, {"id": "S5C3-110", "section": "3.4 D", "sectionTitle": "Transformations of Functions", "kind": "notation", "title": "Circled 1 and 2 mark transformation order", "statement": "In the section on two transformations, the circled numbers ① and ② stand for the 1st transformation and the 2nd transformation respectively.", "sources": [{"page": "Page056", "printed": "3.56", "where": "margin note"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "keyIdea": "K3-12", "level": "extra", "hidden": true, "hiddenWhy": "A convention of the book's printing, not a knowledge point."}, {"id": "S5C3-111", "section": "3.4 D", "sectionTitle": "Transformations of Functions", "kind": "property", "title": "Some pairs work in either order", "statement": "For some pairs of transformations, doing the 2nd transformation first and then the 1st still gives the graph of $y = g(x)$.", "example": "$g(x) = f(x - 2) + 4$: to the right by 2 units then upwards by 4 units, or upwards first then to the right.", "sources": [{"page": "Page056", "printed": "3.56", "where": "margin note"}, {"page": "Page057", "printed": "3.57", "where": "teacher note"}, {"page": "Page063", "printed": "3.63", "where": "teacher note"}, {"page": "Page076", "printed": "3.76", "where": "exercise"}, {"page": "Page089", "printed": "3.89", "where": "exercise"}, {"page": "Page091", "printed": "3.91", "where": "exercise"}, {"page": "Page092", "printed": "3.92", "where": "exercise"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "inferred": "The margin notes on P.3.56 and the answer notes on P.3.89 and P.3.91 are printed in the student book; the same notes on P.3.57 and P.3.63 are in magenta. For $-f(8x)$ the book gives both orders as answers (P.3.92) instead of a note. Our own reading, which fits every case in the book but is not stated there: the order can be swapped when one transformation acts on $x$ (inside the bracket) and the other acts on $y$ (outside it), or when neither of the two is a translation. Under this reading $5f(x)-1$ is a case where the order matters, because $5[f(x)-1]=5f(x)-5$.", "keyIdea": "K3-12", "level": "supporting", "parent": "S5C3-109", "role": "property", "short": "Some pairs can swap", "treeOrder": 78}, {"id": "S5C3-112", "section": "3.4 D", "sectionTitle": "Transformations of Functions", "kind": "method-idea", "title": "Apply the transformations in order", "statement": "To express $g(x)$ in terms of $f(x)$ after two transformations, apply them one after the other. Reflecting $y = f(x)$ with respect to the $x$-axis gives $y = -f(x)$, and translating this downwards by 3 units gives $g(x) = -f(x) - 3$.", "figure": "Example 18 Sketch it Out: $y = f(x)$ is an upside-down U below the $x$-axis with $y$-intercept $-9$. Its reflection $y = -f(x)$ is a U above the axis with $y$-intercept 9. Moving it down 3 units gives $y = -f(x) - 3$, a U with $y$-intercept 6, which is the given graph of $y = g(x)$.", "sources": [{"page": "Page057", "printed": "3.57", "where": "example"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "keyIdea": "K3-12", "level": "core", "parent": "S5C3-109", "role": "reverse", "short": "Apply in order to write $g(x)$", "treeOrder": 76}, {"id": "S5C3-113", "section": "3.4 D", "sectionTitle": "Transformations of Functions", "kind": "property", "title": "Sometimes the order matters", "statement": "The order of two transformations can matter. Reflecting with respect to the $x$-axis and then translating downwards by 3 units gives $-f(x) - 3$, but translating first and then reflecting gives $-[f(x) - 3] = -f(x) + 3$.", "sources": [{"page": "Page057", "printed": "3.57", "where": "Q&A"}], "teacherOnly": true, "nonFoundation": true, "inSummary": false, "inferred": "The Think question on P.3.57 is printed for students, but its answer is printed only in magenta. The student pages show the same point only indirectly: the printed answers to Exercise 3D Q25(b) (P.3.91) and Supplementary Exercise 3 Q30(a), (b) (P.3.92) change the direction of the translation when the order is changed.", "keyIdea": "K3-12", "level": "supporting", "parent": "S5C3-111", "role": "warning", "short": "Sometimes the order matters", "treeOrder": 79}, {"id": "S5C3-114", "section": "3.4 D", "sectionTitle": "Transformations of Functions", "kind": "method-idea", "title": "Sketch the basic graph, then transform", "statement": "To find unknown constants such as $a$ in $y = a\\sin 2x^\\circ$ from a given graph, first sketch the basic graph $y = \\sin x^\\circ$. Then apply the transformations one by one until the given graph is obtained, and read off the constants.", "figure": "Example 19: three graphs in a row. $y = \\sin x^\\circ$ rises first from the origin; its reflection $y = -\\sin x^\\circ$ falls first and reaches its maximum 1 at $x = 270$; reducing to $\\frac{1}{2}$ along the $x$-axis gives $y = -\\sin 2x^\\circ$, whose maximum 1 is at $x = \\frac{1}{2} \\times 270$. This matches the given graph.", "sources": [{"page": "Page058", "printed": "3.58", "where": "example"}, {"page": "Page083", "printed": "3.83", "where": "DSE support"}, {"page": "Page103", "printed": "T3.92k", "where": "example"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "keyIdea": "K3-12", "level": "supporting", "parent": "S5C3-109", "role": "method", "short": "Sketch the basic graph first", "treeOrder": 82}, {"id": "S5C3-115", "section": "3.4 D", "sectionTitle": "Transformations of Functions", "kind": "method-idea", "title": "Read $f(1 - x)$ as $f(-(x - 1))$", "statement": "To see how $y = f(1 - x)$ comes from $y = f(x)$, write $f(1 - x) = f(-(x - 1))$. Reflect with respect to the $y$-axis to get $y = f(-x)$, then translate to the right by 1 unit to get $y = f(-(x - 1))$.", "sources": [{"page": "Page059", "printed": "3.59", "where": "example"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "keyIdea": "K3-12", "level": "supporting", "parent": "S5C3-109", "role": "method", "short": "$f(1 - x) = f(-(x - 1))$", "treeOrder": 81}, {"id": "S5C3-116", "section": "3.4 D", "sectionTitle": "Transformations of Functions", "kind": "property", "title": "The other order needs a different translation", "statement": "Sometimes the same graph comes from the other order only if one transformation is changed. $y = f(1 - x)$ is $y = f(x)$ reflected with respect to the $y$-axis and then translated to the right by 1 unit, or translated to the left by 1 unit and then reflected.", "sources": [{"page": "Page059", "printed": "3.59", "where": "margin note"}, {"page": "Page063", "printed": "3.63", "where": "exercise"}, {"page": "Page076", "printed": "3.76", "where": "exercise"}, {"page": "Page091", "printed": "3.91", "where": "exercise"}, {"page": "Page092", "printed": "3.92", "where": "exercise"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "inferred": "The margin note on P.3.59 leaves the check to students. The first sentence is our summary of that note and of the printed answers on P.3.91 and P.3.92, which give both orders without comment.", "keyIdea": "K3-12", "level": "supporting", "parent": "S5C3-111", "role": "extends", "short": "Other order, other translation", "treeOrder": 80}, {"id": "S5C3-117", "section": "3.4 D", "sectionTitle": "Transformations of Functions", "kind": "method-idea", "title": "Track the vertex through each step", "statement": "The vertex of a transformed graph can be found by applying the same transformations to the vertex of the original graph.", "example": "Reflecting in the $y$-axis takes $P(k, 2k^2 + 6)$ to $(-k, 2k^2 + 6)$; translating to the right by 1 unit then gives $(-k + 1, 2k^2 + 6)$.", "figure": "Example 20(b): an upside-down U-shaped graph $y = f(x)$ with vertex $P(k, 2k^2 + 6)$ and its mirror image $y = f(-x)$ with vertex $P'(-k, 2k^2 + 6)$; $P'$ is then moved 1 unit to the right to $Q(-k + 1, 2k^2 + 6)$ on $y = f(1 - x)$.", "sources": [{"page": "Page059", "printed": "3.59", "where": "example"}, {"page": "Page104", "printed": "T3.92l", "where": "example"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "inferred": "The general sentence is our summary; the book shows the moving vertex on its diagrams.", "keyIdea": "K3-12", "level": "supporting", "parent": "S5C3-112", "role": "method", "short": "Track the vertex", "treeOrder": 77}, {"id": "S5C3-118", "section": "3.4 D", "sectionTitle": "Transformations of Functions", "kind": "link", "title": "Orthocentre gives perpendicular lines", "statement": "Questions on transformations can be combined with centres of a triangle. If $R$ is the orthocentre of $\\triangle OPQ$, then $OQ \\perp PR$, so the slope of $OQ$ equals $-\\frac{1}{\\text{slope of } PR}$.", "figure": "Diagram Clue: triangle $OPQ$ with its three altitudes drawn as dashed lines meeting at the orthocentre $R$; the line through $P$ and $R$ meets side $OQ$ at a right angle.", "sources": [{"page": "Page060", "printed": "3.60", "where": "example"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "keyIdea": "K3-12", "level": "extra", "hidden": true, "hiddenWhy": "Knowledge from other topics (triangle centres, circles, the discriminant) used in a cross-topic DSE question; not this chapter's new knowledge."}, {"id": "S5C3-119", "section": "3.4 D", "sectionTitle": "Transformations of Functions", "kind": "link", "title": "Negative discriminant shows a case is impossible", "statement": "To show that a condition is impossible, turn it into an equation. If the equation is quadratic and its discriminant $\\Delta$ is negative, it has no real roots, so the condition can never hold.", "example": "Assuming the slope of $PR$ is 2 leads to $4k^2 - k + 13 = 0$, with $\\Delta = (-1)^2 - 4(4)(13) = -207 < 0$. So it is impossible that the slope of $PR$ is 2.", "sources": [{"page": "Page060", "printed": "3.60", "where": "example"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "inferred": "The general sentence is our summary of the argument in Example 20(c).", "keyIdea": "K3-12", "level": "extra", "hidden": true, "hiddenWhy": "Knowledge from other topics (triangle centres, circles, the discriminant) used in a cross-topic DSE question; not this chapter's new knowledge."}, {"id": "S5C3-120", "section": "3.4 D", "sectionTitle": "Transformations of Functions", "kind": "link", "title": "Centroid lies on a median", "statement": "If the mid-point of $PQ$ lies on the $x$-axis, then a median of $\\triangle OPQ$ (the one from the origin $O$) coincides with the $x$-axis, so the centroid of $\\triangle OPQ$ lies on the $x$-axis.", "sources": [{"page": "Page104", "printed": "T3.92l", "where": "example"}], "teacherOnly": true, "nonFoundation": true, "inSummary": false, "inferred": "The fact that the centroid lies on every median is background knowledge the solution uses but does not state.", "keyIdea": "K3-12", "level": "extra", "hidden": true, "hiddenWhy": "Knowledge from other topics (triangle centres, circles, the discriminant) used in a cross-topic DSE question; not this chapter's new knowledge."}, {"id": "S5C3-121", "section": "Extra DSE Support", "sectionTitle": "Extra DSE Support", "kind": "method-idea", "title": "Express g(x) in terms of f(x) first", "statement": "In a structured exam question, first express $g(x)$ in terms of $f(x)$ (for example $g(x) = f(-x) - 5$ for a reflection with respect to the $y$-axis followed by a translation downwards by 5 units). Then substitute and use completing the square to write $g(x)$ in the form $(x - h)^2 + k$ and read off the vertex. The marking scheme gives a mark for each of these steps.", "sources": [{"page": "Page081", "printed": "3.81", "where": "DSE support"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "keyIdea": "K3-12", "level": "extra", "hidden": true, "hiddenWhy": "Exam technique for one DSE question; writing g(x) in terms of f(x) is already a card."}, {"id": "S5C3-122", "section": "Extra DSE Support", "sectionTitle": "Extra DSE Support", "kind": "property", "title": "Smallest circle through two fixed points", "statement": "Suppose $P$ and $Q$ are fixed points. Among the circles passing through $P$ and $Q$, the area of the circle is the least when $PQ$ is a diameter of the circle.", "figure": "Star Tips: three circles all passing through $P$ and $Q$; the smallest one has the dashed segment $PQ$ as a diameter and is labelled 'circle with the least area'.", "sources": [{"page": "Page081", "printed": "3.81", "where": "DSE support"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "keyIdea": "K3-12", "level": "extra", "hidden": true, "hiddenWhy": "Knowledge from other topics (triangle centres, circles, the discriminant) used in a cross-topic DSE question; not this chapter's new knowledge."}, {"id": "S5C3-123", "section": "Extra DSE Support", "sectionTitle": "Extra DSE Support", "kind": "link", "title": "Angle in a semicircle gives perpendicular slopes", "statement": "If $FO$ is a diameter of a circle and $U$ lies on the circle, then $\\angle FUO = 90^\\circ$. So the product of the slopes of $FU$ and $OU$ is $-1$, which gives an equation for the unknown constant.", "watchOut": "Before using the product of slopes, the solution writes down the excluded values $k \\neq -\\frac{1}{2}$ and $k \\neq \\frac{11}{2}$.", "sources": [{"page": "Page081", "printed": "3.81", "where": "DSE support"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "inferred": "The reason for excluding these values (a slope with a zero denominator) is our reading; the book only states the exclusions.", "keyIdea": "K3-12", "level": "extra", "hidden": true, "hiddenWhy": "Knowledge from other topics (triangle centres, circles, the discriminant) used in a cross-topic DSE question; not this chapter's new knowledge."}, {"id": "S5C3-124", "section": "Extra DSE Support", "sectionTitle": "Extra DSE Support", "kind": "link", "title": "Testing whether four points are concyclic", "statement": "$V$ lies on the circle with diameter $FO$, so $\\angle FVO = 90^\\circ$. If the slope of $FE$ times the slope of $OE$ is not $-1$, then $\\angle FEO \\neq 90^\\circ$, so $E$, $F$, $O$ and $V$ are not concyclic.", "sources": [{"page": "Page082", "printed": "3.82", "where": "DSE support"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "inferred": "The solution relies on the converse of the angle in a semicircle without naming it.", "keyIdea": "K3-12", "level": "extra", "hidden": true, "hiddenWhy": "Knowledge from other topics (triangle centres, circles, the discriminant) used in a cross-topic DSE question; not this chapter's new knowledge."}, {"id": "S5C3-125", "section": "Chapter Highlight", "sectionTitle": "Chapter Highlight", "kind": "method-idea", "title": "Why use graphs to solve problems", "statement": "Algebraic expressions are often used to represent the relations among variables in practical problems, but sometimes the problems are difficult to solve directly through the expressions. If the corresponding graphs are available, they can be used to solve the problems.", "sources": [{"page": "Page093", "printed": "T3.92a", "where": "teacher note"}], "teacherOnly": true, "nonFoundation": false, "inSummary": false, "keyIdea": "K3-5", "level": "extra", "hidden": true, "hiddenWhy": "A teacher-only chapter highlight (purpose, prerequisites or curriculum objective)."}, {"id": "S5C3-126", "section": "Chapter Highlight", "sectionTitle": "Chapter Highlight", "kind": "link", "title": "Prerequisites: functions and transforming points", "statement": "Before this chapter, students should recognise the concept of functions and know the transformations of points in a rectangular coordinate plane, including translation and reflection. Teachers may ask students to do the Review Exercise in §3.0 Review (P.3.2) for better preparation.", "sources": [{"page": "Page093", "printed": "T3.92a", "where": "teacher note"}], "teacherOnly": true, "nonFoundation": false, "inSummary": false, "keyIdea": "K3-7", "level": "extra", "hidden": true, "hiddenWhy": "A teacher-only chapter highlight (purpose, prerequisites or curriculum objective)."}, {"id": "S5C3-127", "section": "Chapter Highlight", "sectionTitle": "Chapter Highlight", "kind": "link", "title": "Transformations from tabular, symbolic, graphical views", "statement": "The curriculum objective for §3.4 is to understand the transformations of the function $f(x)$, including $f(x) + k$, $f(x + k)$, $kf(x)$ and $f(kx)$, from tabular, symbolic and graphical perspectives.", "sources": [{"page": "Page093", "printed": "T3.92a", "where": "teacher note"}], "teacherOnly": true, "nonFoundation": true, "inSummary": false, "keyIdea": "K3-7", "level": "extra", "hidden": true, "hiddenWhy": "A teacher-only chapter highlight (purpose, prerequisites or curriculum objective)."}], "keyIdeas": [{"id": "K3-1", "title": "Comparing common functions", "summary": "Common functions are compared by their domains, their maximum and minimum values, symmetry and period. Constant and linear functions are the simplest cases.", "shape": "clusters"}, {"id": "K3-2", "title": "Quadratic functions", "summary": "The graph of $y = a(x - h)^2 + k$ is a parabola with vertex $(h, k)$. It opens upwards when $a > 0$ and downwards when $a < 0$, and $k$ is its minimum or maximum value.", "shape": "tree"}, {"id": "K3-3", "title": "Trigonometric functions", "summary": "The sine, cosine and tangent functions are periodic. Sine and cosine have period $360^\\circ$ and values from $-1$ to $1$; tangent has period $180^\\circ$ and no maximum or minimum value.", "shape": "tree"}, {"id": "K3-4", "title": "Exponential and logarithmic functions", "summary": "For $a > 0$ and $a \\neq 1$, the graph of $y = a^x$ lies above the $x$-axis and passes through $(0, 1)$, and the graph of $y = \\log_a x$ lies on the right of the $y$-axis and passes through $(1, 0)$. Each graph is the reflection of the other in the line $y = x$.", "shape": "clusters"}, {"id": "K3-5", "title": "Solving equations by using graphs", "summary": "The roots of $f(x) = k$ are the $x$-coordinates of the points where the graphs of $y = f(x)$ and $y = k$ meet.", "shape": "tree"}, {"id": "K3-6", "title": "Solving inequalities by using graphs", "summary": "The solutions of $f(x) > k$ are the values of $x$ for which the graph of $y = f(x)$ is above the line $y = k$, and those of $f(x) < k$ where it is below. With $\\geq$ or $\\leq$, the points of intersection are included.", "shape": "clusters"}, {"id": "K3-7", "title": "Transformations of functions", "summary": "The graph of a function is made up of points, so it can be translated and reflected like points. Writing $g(x)$ in terms of $f(x)$ names the transformation.", "shape": "tree"}, {"id": "K3-8", "title": "Translation", "summary": "Translating the graph of $y = f(x)$ upwards or downwards by $k$ units gives $y = f(x) \\pm k$. Translating it to the left by $k$ units gives $y = f(x + k)$, and to the right gives $y = f(x - k)$.", "shape": "tree"}, {"id": "K3-9", "title": "Reflection", "summary": "Reflecting the graph of $y = f(x)$ with respect to the $x$-axis gives $y = -f(x)$, and with respect to the $y$-axis gives $y = f(-x)$.", "shape": "tree"}, {"id": "K3-10", "title": "Enlargement and reduction along the $y$-axis", "summary": "Enlarging the graph of $y = f(x)$ to $k$ times the original ($k > 1$), or reducing it to $k$ of the original ($0 < k < 1$), along the $y$-axis gives $y = kf(x)$.", "shape": "tree"}, {"id": "K3-11", "title": "Enlargement and reduction along the $x$-axis", "summary": "Along the $x$-axis, $y = f(kx)$ is the graph of $y = f(x)$ reduced to $\\frac{1}{k}$ of the original when $k > 1$, and enlarged to $\\frac{1}{k}$ times the original when $0 < k < 1$.", "shape": "tree"}, {"id": "K3-12", "title": "Two transformations", "summary": "Two transformations are read from $g(x)$ one change at a time, and applied to the graph one after the other.", "shape": "tree"}], "chapter": null, "checks": null, "released": false}, {"key": "ch4", "label": "Ch4 Variations", "pageDir": "../S5 Ch4 pages/", "pageExt": ".jpg", "origin": "merged", "cards": [{"id": "S5C4-001", "section": "Opener", "sectionTitle": "Relation among Quantities", "kind": "link", "title": "Quantities can be linked by a relation", "statement": "In the dim sum example, Lily spends $T$ dollars on $x$ small, $y$ medium and $z$ large dishes. If she buys more dishes, she has to spend more money, so there is a relation among $T$, $x$, $y$ and $z$, and it can be shown by an equation.", "example": "Small, medium and large dishes cost 20, 30 and 40 dollars each, and Lily also pays 0.5 dollars for a plastic bag: $T = 20x + 30y + 40z + 0.5$.", "sources": [{"page": "Page01", "printed": "4.1 (not printed)", "where": "main text"}, {"page": "Page01", "printed": "4.1 (not printed)", "where": "Q&A"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The equation in the example is printed only in magenta (teacher edition).", "keyIdea": "K4-1", "level": "supporting", "check": {"pages": ["4.1 (not printed)"], "date": "2026-10-06", "result": "fixed", "notes": "(scope) The card turns one example into a general rule ('the relation among them can be written as an equation'). The book only says there is a relation among $T$, $x$, $y$ and $z$ here, and asks for an equation in this one case. | final: (context) The statement and the example use $T$, $x$, $y$ and $z$ without saying what they stand for, and the example's 20, 30, 40 and 0.5 come from facts the card never gives (the unit prices of the dishes and the plastic bag, P.4.1 Q&A).", "final": "fixed", "confirmed": "2026-10-06 (after fix)"}, "hidden": true, "hiddenWhy": "Chapter-opener motivation, not a knowledge point to revise."}, {"id": "S5C4-002", "section": "4.0 A", "sectionTitle": "Direct Proportions and Inverse Proportions", "kind": "link", "title": "Direct proportion: equal ratios", "statement": "In junior forms, we learnt that if $x$ and $y$ are in direct proportion, then $x_1 : x_2 = y_1 : y_2$ for any two pairs of values. Direct variation develops from this idea.", "example": "At 20 km/h, time $1 : 2$ gives distance $20 : 40 = 1 : 2$.", "sources": [{"page": "Page02", "printed": "4.2", "where": "review"}, {"page": "Page02", "printed": "4.2", "where": "note"}, {"page": "Page05", "printed": "4.5", "where": "main text"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-2", "level": "supporting", "check": {"pages": ["4.2", "4.5"], "date": "2026-10-06", "result": "fixed", "notes": "(direction) The book says: if $x$ and $y$ are in direct proportion, then $x_1 : x_2 = y_1 : y_2$. The card turns this round into a test ('are in direct proportion when ...'). Both directions happen to be true here, so the risk is low, but the card should keep the book's direction.", "final": "pass"}, "hidden": true, "hiddenWhy": "Junior-form review of direct proportion."}, {"id": "S5C4-003", "section": "4.0 A", "sectionTitle": "Direct Proportions and Inverse Proportions", "kind": "link", "title": "Inverse proportion: reciprocal ratios", "statement": "In junior forms, we learnt that if $x$ and $y$ are in inverse proportion, then $x_1 : x_2 = y_2 : y_1$, that is $x_1y_1 = x_2y_2$, for any two pairs of values. Inverse variation develops from this idea.", "example": "Anna spends 60 dollars on masks: at 2 and 3 dollars each she gets 30 and 20 masks, and $2 : 3 = 20 : 30$.", "sources": [{"page": "Page02", "printed": "4.2", "where": "review"}, {"page": "Page02", "printed": "4.2", "where": "note"}, {"page": "Page13", "printed": "4.13", "where": "main text"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-3", "level": "supporting", "check": {"pages": ["4.13", "4.2"], "date": "2026-10-06", "result": "fixed", "notes": "(direction) The book says: if $x$ and $y$ are in inverse proportion, then $x_1 : x_2 = y_2 : y_1$. The card turns this round into a test ('are in inverse proportion when ...'). Both directions happen to be true here, so the risk is low, but the card should keep the book's direction. | final: (context) The mask example does not say that the total spent is fixed at 60 dollars (P.4.4, P.4.13), so the inverse proportion between price and number of masks is not justified.", "final": "fixed", "confirmed": "2026-10-06"}, "hidden": true, "hiddenWhy": "Junior-form review of inverse proportion."}, {"id": "S5C4-004", "section": "4.0 B", "sectionTitle": "Percentage Change", "kind": "property", "title": "Percentage change formula", "statement": "Percentage change $= \\frac{\\text{new value} - \\text{original value}}{\\text{original value}} \\times 100\\%$.", "example": "25 cm to 30 cm: $+20\\%$.", "sources": [{"page": "Page02", "printed": "4.2", "where": "review"}, {"page": "Page09", "printed": "4.9", "where": "margin note"}, {"page": "Page18", "printed": "4.18", "where": "margin note"}, {"page": "Page25", "printed": "4.25", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-7", "level": "supporting", "check": {"pages": ["4.18", "4.2", "4.25", "4.9"], "date": "2026-10-06", "result": "equivalent", "notes": "", "final": "pass"}, "hidden": true, "hiddenWhy": "Junior-form review of the percentage change formula."}, {"id": "S5C4-005", "section": "4.0 B", "sectionTitle": "Percentage Change", "kind": "property", "title": "New value after a percentage change", "statement": "After a change of $r\\%$, the new value is the original value $\\times (1 + r\\%)$, where $r$ is negative for a decrease.", "example": "$w$ up 44%: $1.44w$. $q$ down 60%: $0.4q$.", "sources": [{"page": "Page02", "printed": "4.2", "where": "review"}, {"page": "Page09", "printed": "4.9", "where": "example"}, {"page": "Page18", "printed": "4.18", "where": "example"}, {"page": "Page25", "printed": "4.25", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-7", "level": "supporting", "check": {"pages": ["4.18", "4.2", "4.25", "4.9"], "date": "2026-10-06", "result": "equivalent", "notes": "", "final": "pass"}, "hidden": true, "hiddenWhy": "Junior-form review of a new value after a percentage change."}, {"id": "S5C4-006", "section": "4.0 B", "sectionTitle": "Percentage Change", "kind": "wording", "title": "Sign of a change: increase or decrease", "statement": "A positive change or percentage change means an increase, and a negative one means a decrease.", "example": "$-20\\%$ means a decrease of 20%.", "sources": [{"page": "Page02", "printed": "4.2", "where": "margin note"}, {"page": "Page02", "printed": "4.2", "where": "teacher note"}, {"page": "Page07", "printed": "4.7", "where": "margin note"}, {"page": "Page08", "printed": "4.8", "where": "margin note"}, {"page": "Page09", "printed": "4.9", "where": "example"}, {"page": "Page16", "printed": "4.16", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-7", "level": "supporting", "check": {"pages": ["4.16", "4.2", "4.7", "4.8", "4.9"], "date": "2026-10-06", "result": "equivalent", "notes": "", "final": "pass"}, "hidden": true, "hiddenWhy": "Junior-form review of the sign of a change."}, {"id": "S5C4-007", "section": "4.0 C", "sectionTitle": "Solving Simultaneous Linear Equations in Two Unknowns by the Algebraic Method", "kind": "link", "title": "Two algebraic methods for simultaneous equations", "statement": "Simultaneous linear equations can be solved by substitution or by elimination. This chapter uses them to find $k_1$ and $k_2$.", "example": "$5x + y = 7$ and $4x - y = 11$: adding gives $9x = 18$.", "sources": [{"page": "Page03", "printed": "4.3", "where": "review"}, {"page": "Page32", "printed": "4.32", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-8", "level": "supporting", "check": {"pages": ["4.3", "4.32"], "date": "2026-10-06", "result": "equivalent", "notes": "", "final": "pass"}, "hidden": true, "hiddenWhy": "Junior-form review of solving simultaneous equations."}, {"id": "S5C4-008", "section": "4.1", "sectionTitle": "Direct Variations and Inverse Variations", "kind": "definition", "title": "Variation", "statement": "When variables change together according to a specific relation, we say they vary with each other. Such a relation is called a **variation**.", "example": "At a constant 20 km/h, time $x$ hours and distance $y$ km satisfy $y = 20x$, so $x$ and $y$ vary with each other.", "sources": [{"page": "Page04", "printed": "4.4", "where": "main text"}, {"page": "Page04", "printed": "4.4", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-1", "level": "core", "check": {"pages": ["4.4"], "date": "2026-10-06", "result": "equivalent", "notes": " | final: (context) The example shows $y = 20x$ before saying what $x$ and $y$ are (the teacher's own example).", "final": "fixed", "confirmed": "2026-10-06"}, "parent": null, "role": null, "short": "Variation", "treeOrder": 0}, {"id": "S5C4-009", "section": "4.1 A", "sectionTitle": "Direct Variations and Their Graphs", "kind": "definition", "title": "Direct variation", "statement": "If $y$ varies directly as $x$, then $y = kx$, where $k$ is a ==non-zero== constant. The variation relation between $x$ and $y$ is called **direct variation**.", "sources": [{"page": "Page05", "printed": "4.5", "where": "activity"}, {"page": "Page06", "printed": "4.6", "where": "main text"}, {"page": "Page06", "printed": "4.6", "where": "definition box"}, {"page": "Page39", "printed": "4.39", "where": "main text"}, {"page": "Page49", "printed": "4.49", "where": "summary"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "keyIdea": "K4-2", "level": "core", "term": "direct variation", "positive": {"example": "$y = 50x$", "why": "$y = kx$ with $k = 50$, which is a ==non-zero== constant.", "source": "authored"}, "negative": {"example": "$y = 50x + 20$", "why": "The added 20 means $y$ is not a constant times $x$, so the line misses the origin.", "source": "authored"}, "check": {"pages": ["4.39", "4.49", "4.5", "4.6"], "date": "2026-10-06", "result": "fixed", "notes": "(direction) The book says: if $y$ varies directly as $x$, then $y = kx$. The card reverses it to 'if $y = kx$ ..., then $y$ varies directly as $x$'.; (condition) 'non-zero' is dropped. With the reversed wording, $k = 0$ (the relation $y = 0$) would wrongly count as a direct variation.; (condition) positive.why says 'a constant times $x$'. It should say a non-zero constant.", "final": "pass"}, "parent": null, "role": null, "short": "Direct variation", "treeOrder": 3}, {"id": "S5C4-010", "section": "4.1 A", "sectionTitle": "Direct Variations and Their Graphs", "kind": "property", "title": "In direct variation, $\\frac{y}{x}$ is constant", "statement": "If $y$ varies directly as $x$, then $\\frac{y}{x}$ stays the same for every ==non-zero== $x$. This constant value is $k$.", "sources": [{"page": "Page05", "printed": "4.5", "where": "activity"}, {"page": "Page06", "printed": "4.6", "where": "main text"}, {"page": "Page06", "printed": "4.6", "where": "margin note"}, {"page": "Page06", "printed": "4.6", "where": "teacher note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-2", "level": "core", "visual": {"type": "table", "head": "col", "rows": [["$x$", "1", "2", "3", "4", "5"], ["$y$", "50", "100", "150", "200", "250"], ["$\\frac{y}{x}$", "50", "50", "50", "50", "50"]], "words": false}, "check": {"pages": ["4.5", "4.6"], "date": "2026-10-06", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "S5C4-009", "role": "property", "short": "$\\frac{y}{x}$ is constant", "treeOrder": 5}, {"id": "S5C4-011", "section": "4.1 A", "sectionTitle": "Direct Variations and Their Graphs", "kind": "notation", "title": "The variation symbol $\\propto$", "statement": "'$y$ varies directly as $x$' is written $y \\propto x$.", "example": "$b \\propto a$ means $b = ka$, where $k$ is a ==non-zero== constant.", "sources": [{"page": "Page06", "printed": "4.6", "where": "definition box"}, {"page": "Page06", "printed": "4.6", "where": "note"}, {"page": "Page07", "printed": "4.7", "where": "example"}, {"page": "Page49", "printed": "4.49", "where": "summary"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "keyIdea": "K4-2", "level": "core", "check": {"pages": ["4.49", "4.6", "4.7"], "date": "2026-10-06", "result": "fixed", "notes": "(condition) The example '$b \\propto a$ means $b = ka$' drops 'where $k$ is a non-zero constant', which the book writes every time it turns $\\propto$ into an equation.", "final": "pass"}, "parent": "S5C4-009", "role": "notation", "short": "$y \\propto x$", "treeOrder": 4}, {"id": "S5C4-012", "section": "4.1 A", "sectionTitle": "Direct Variations and Their Graphs", "kind": "definition", "title": "Variation constant", "statement": "In $y = kx$ or $y = \\frac{k}{x}$, the constant $k$ is called the **variation constant**. In a partial variation such as $z = k_1 + k_2x$, the parts have separate variation constants, written $k_1$ and $k_2$, whose values ==may== be different.", "example": "$y = 50x$: 50 is the variation constant.", "sources": [{"page": "Page06", "printed": "4.6", "where": "note"}, {"page": "Page17", "printed": "4.17", "where": "example"}, {"page": "Page31", "printed": "4.31", "where": "activity"}, {"page": "Page39", "printed": "4.39", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "keyIdea": "K4-1", "level": "core", "check": {"pages": ["4.17", "4.31", "4.39", "4.6"], "date": "2026-10-06", "result": "fixed", "notes": "(scope) 'A partial variation has two' narrows the book's definition. A partial variation is the sum of two or more parts, so it can have more than two variation constants. The book's examples happen to use only $k_1$ and $k_2$. | final: (ambiguous) 'each part has its own variation constant' can be read as 'the constants must have different values'. The same wording was taken out of S5C4-050 for this reason. The book says to use two different symbols (N9, P.4.31) and that the constants may be different (Note, P.4.31); P.4.53 Q15 has $y = 2x + 2x^2$, where both constants are 2.", "final": "fixed", "confirmed": "2026-10-06"}, "parent": "S5C4-008", "role": "extends", "short": "Variation constant $k$", "treeOrder": 1}, {"id": "S5C4-013", "section": "4.1 A", "sectionTitle": "Direct Variations and Their Graphs", "kind": "condition", "title": "The variation constant is non-zero", "statement": "Every variation constant in this chapter is ==non-zero==: ==$k \\neq 0$==, and in a partial variation $k_1 \\neq 0$ and $k_2 \\neq 0$.", "sources": [{"page": "Page06", "printed": "4.6", "where": "definition box"}, {"page": "Page14", "printed": "4.14", "where": "definition box"}, {"page": "Page23", "printed": "4.23", "where": "main text"}, {"page": "Page31", "printed": "4.31", "where": "main text"}, {"page": "Page41", "printed": "4.41", "where": "example"}, {"page": "Page42", "printed": "4.42", "where": "example"}, {"page": "Page43", "printed": "4.43", "where": "example"}, {"page": "Page49", "printed": "4.49", "where": "summary"}, {"page": "Page50", "printed": "4.50", "where": "summary"}, {"page": "Page60", "printed": "4.60", "where": "DSE support"}], "teacherOnly": false, "n itle": "Direct variation need not mean increasing", "statement": "If $y$ varies directly as $x$, $y$ does ==not always== increase as $x$ increases. When ==$k < 0$==, $y$ decreases as $x$ increases.", "example": "$y = -3x$: as $x$ increases, $y$ decreases.", "sources": [{"page": "Page06", "printed": "4.6", "where": "Q&A"}, {"page": "Page06", "printed": "4.6", "where": "teacher note"}], "teacherOnly": true, "nonFoundation": false, "inSummary": false, "inferred": "The Think box question is in the student book, but its answer is printed only in magenta.", "keyIdea": "K4-2", "level": "core", "check": {"pages": ["4.6"], "date": "2026-10-06", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "S5C4-017", "role": "warning", "short": "Need not increase", "treeOrder": 9}, {"id": "S5C4-020", "section": "4.1 A", "sectionTitle": "Direct Variations and Their Graphs", "kind": "method-idea", "title": "Find the variation constant by substitution", "statement": "Write the variation with an unknown $k$, substitute one known set of values and solve for $k$. One set is enough for a direct, inverse or joint variation.", "example": "$b = ka$ and $b = 80$ when $a = 20$: $k = 4$, so $b = 4a$.", "sources": [{"page": "Page07", "printed": "4.7", "where": "margin note"}, {"page": "Page07", "printed": "4.7", "where": "example"}, {"page": "Page15", "printed": "4.15", "where": "example"}, {"page": "Page23", "printed": "4.23", "where": "example"}, {"page": "Page41", "printed": "4.41", "where": "example"}, {"page": "Page50", "printed": "4.50", "where": "summary"}, {"page": "Page73", "printed": "T4.68e", "where": "example"}, {"page": "Page77", "printed": "T4.68i", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "inferred": "The book does not say in words that one set of values is enough. This is read from the worked examples (such as Examples 1, 5, 9 and 18), the two summary examples on P.4.49–4.50 and the teacher's Supplementary Examples 9, 10 and 18, which each use a single set of values to find $k$.", "keyIdea": "K4-8", "level": "core", "check": {"pages": ["4.15", "4.23", "4.41", "4.50", "4.7", "T4.68e", "T4.68i"], "date": "2026-10-06", "result": "equivalent", "notes": "", "final": "pass"}, "parent": null, "role": null, "short": "One constant: one set of values", "treeOrder": 42}, {"id": "S5C4-021", "section": "4.1 A", "sectionTitle": "Direct Variations and Their Graphs", "kind": "wording", "title": "Varying as a power, root or expression", "statement": "A variable can vary directly or inversely as a power, a root or an expression of another variable. The whole quantity after '*as*' takes the place of $x$ in $y = kx$ or $y = \\frac{k}{x}$, where $k$ is a ==non-zero== constant.", "sources": [{"page": "Page07", "printed": "4.7", "where": "example"}, {"page": "Page09", "printed": "4.9", "where": "example"}, {"page": "Page12", "printed": "4.12", "where": "exercise"}, {"page": "Page16", "printed": "4.16", "where": "exercise"}, {"page": "Page18", "printed": "4.18", "where": "example"}, {"page": "Page19", "printed": "4.19", "where": "activity"}, {"page": "Page49", "printed": "4.49", "where": "summary"}, {"page": "Page70", "printed": "T4.68b", "where": "example"}, {"page": "Page71", "printed": "T4.68c", "where": "example"}, {"page": "Page76", "printed": "T4.68h", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "inferred": "The rule that the whole quantity after 'as' replaces $x$ is generalised from the worked examples; the book does not state it. The table rows come from Example 2 ($x^2$, P.4.7), Example 4 ($\\sqrt{w}$, P.4.9), Example 8 ($n^2$, P.4.18) and Exercise 4A Q13 ($x + 5$, P.4.12). The summary on P.4.49 shows only the $x^2$ case.", "keyIdea": "K4-4", "level": "core", "visual": {"type": "table", "head": "row", "rows": [["Words", "Equation"], ["$y$ varies directly as $x^2$", "$y = kx^2$"], ["$q$ varies directly as $\\sqrt{w}$", "$q = k\\sqrt{w}$"], ["$m$ varies inversely as $n^2$", "$m = \\frac{k}{n^2}$"], ["$y$ varies directly as $(x + 5)$", "$y = k(x + 5)$"]], "words": true}, "check": {"pages": ["4.12", "4.16", "4.18", "4.19", "4.49", "4.7", "4.9", "T4.68b", "T4.68c", "T4.68h"], "date": "2026-10-06", "result": "fixed", "notes": "(unmarked) The rule 'whatever follows as takes the place of $x$' is the card's own summary of the worked examples; the book never states it. The inferred note covers only the $x^2$ and $x^3$ cases.; (condition) Neither the statement nor the table says $k$ is a non-zero constant. The book adds this to every such equation (P.4.7, 4.9, 4.18). | final: (unmarked, teacher-mode note only) The inferred note mentions an $x^3$ case from Supplementary Examples 2 and 16, but the table has no $x^3$ row, and it does not say where the four rows come from.", "final": "fixed", "confirmed": "2026-10-06"}, "parent": "S5C4-057", "role": "extends", "short": "As a power, root or expression", "treeOrder": 22}, {"id": "S5C4-022", "section": "4.1 A", "sectionTitle": "Direct Variations and Their Graphs", "kind": "wording", "title": "The constant multiplies the whole expression", "statement": "'$m$ varies directly as $(n + 1)$' means $m = k(n + 1)$, where $k$ is a ==non-zero== constant, so $k$ multiplies __the whole bracket__. It ==does not mean== $m = kn + 1$.", "sources": [{"page": "Page12", "printed": "4.12", "where": "exercise"}, {"page": "Page51", "printed": "4.51", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The book tests this in an exercise but does not state it in the text. The source is the Checkpoint on P.4.51 (item 1); Exercise 4A Q13 on P.4.12 uses the same kind of expression.", "keyIdea": "K4-4", "level": "core", "check": {"pages": ["4.12", "4.51"], "date": "2026-10-06", "result": "fixed", "notes": "(condition) 'means $m = k(n + 1)$' drops 'where $k$ is a non-zero constant'. The Checkpoint states that $k$ is non-zero.", "final": "pass"}, "parent": "S5C4-021 centage change is asked for with its old value; $k$ cancels, so it ==need not== be known.", "example": "$m = \\frac{k}{n^2}$ and $n$ doubles: the new $m$ is $\\frac{k}{4n^2}$, a change of $-75\\%$.", "sources": [{"page": "Page09", "printed": "4.9", "where": "example"}, {"page": "Page09", "printed": "4.9", "where": "margin note"}, {"page": "Page18", "printed": "4.18", "where": "example"}, {"page": "Page18", "printed": "4.18", "where": "margin note"}, {"page": "Page49", "printed": "4.49", "where": "summary"}, {"page": "Page71", "printed": "T4.68c", "where": "example"}, {"page": "Page73", "printed": "T4.68e", "where": "example"}, {"page": "Page74", "printed": "T4.68f", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "inferred": "That $k$ and the original values cancel is shown in the working, not stated in words.", "keyIdea": "K4-7", "level": "core", "check": {"pages": ["4.18", "4.49", "4.9", "T4.68c", "T4.68e", "T4.68f"], "date": "2026-10-06", "result": "equivalent", "notes": " | final: (scope) The title 'Percentage change in a variation, without knowing $k$' covers every variation, including a partial variation such as $y = k_1 + k_2x$, where a percentage change in general depends on $k_1$ and $k_2$. All the sources of this card are direct, inverse or joint variations.", "final": "fixed", "confirmed": "2026-10-06 (after fix)"}, "parent": null, "role": null, "short": "Percentage change", "treeOrder": 39}, {"id": "S5C4-025", "section": "4.1 A", "sectionTitle": "Direct Variations and Their Graphs", "kind": "common-mistake", "title": "Do not cancel terms wrongly", "statement": "Take out the common factor before cancelling: $\\frac{1.2k\\sqrt{w} - k\\sqrt{w}}{k\\sqrt{w}} = \\frac{k\\sqrt{w}(1.2 - 1)}{k\\sqrt{w}} = 0.2$, which gives $+20\\%$. Crossing out $k\\sqrt{w}$ term by term wrongly gives $120\\%$.", "sources": [{"page": "Page09", "printed": "4.9", "where": "note"}, {"page": "Page09", "printed": "4.9", "where": "example"}], "tea e origin"]], "words": false}, "watchOut": "In both, $k$ is a ==non-zero== constant. The Graph row does not work backwards: $y = 0$ and $x = 0$ are straight lines through the origin but are not direct variations, and the graph of $y = \\frac{1}{x^2}$ is a pair of curves that miss the origin, but $y$ does not vary inversely as $x$.", "check": {"pages": ["4.14", "4.39", "4.6"], "date": "2026-10-06", "result": "fixed", "notes": "(condition) Neither the statement nor the table says $k$ is a non-zero constant (book: '$k$ is a non-zero variation constant', '$k \\neq 0$').; (converse) The Graph row invites the reverse reading 'a straight line through the origin means direct variation', which fails for $y = 0$ and $x = 0$. The card gives no guard. | final: (unmarked) The watch-out about $y = 0$ and $x = 0$ is an added guard, but the inferred note does not say so (S5C4-016 marks the same guard).; (converse) The Graph row also invites the reverse reading 'two curves that miss the origin means inverse variation'. S5C4-032 guards against it with $y = \\frac{1}{x^2}$; this card does not.; (condition) The Constant row '$\\frac{y}{x} = k$' drops $x \\neq 0$, which S5C4-010 and K4-2 keep (teacher note N2, P.4.6).", "final": "fixed", "confirmed": "2026-10-06"}, "parent": null, "role": null, "short": "Directly or inversely", "treeOrder": 20}, {"id": "S5C4-042", "section": "4.2 A", "sectionTitle": "Joint Variations", "kind": "property", "title": "Fixing one variable in $A = \\frac{1}{2}bh$", "statement": "For a triangle with area $A$ cm$^2$, base $b$ cm and height $h$ cm, $A = \\frac{1}{2}bh$: fixing $b$ makes $A$ vary directly as $h$, and fixing $h$ makes $A$ vary directly as $b$. The fixed variable simply becomes part of the constant.", "sources": [{"page": "Page22", "printed": "4.22", "where": "main text"}, {"page": "Page22", "printed": "4.22", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-5", "level": "supporting", "check": {"pages": ["4.22"], "date": "2026-10-06", "result": "equivalent", "notes": " | final: (context) The statement uses $A$, $b$ and $h$ without saying they are the area, base and height of a triangle (P.4.22: area $A$ cm$^2$, base $b$ cm, height $h$ cm).", "final": "fixed", "confirmed": "2026-10-06"}, "parent": "S5C4-043", "role": "property", "short": "Fixing one variable", "treeOrder": 29}, {"id": "S5C4-043", "section": "4.2 A", "sectionTitle": "Joint Variations", "kind": "definition", "title": "Joint variation", "statement": "When a variable varies with the __product__ of two or more variables, the relation is an example of **joint variation**: if $z = kxy$, where $k$ is a ==non-zero== constant, we say $z$ varies jointly as $x$ and $y$. A joint variation ==may== also involve inverse variations, such as $z = \\frac{kx}{y}$.", "sources": [{"page": "Page22", "printed": "4.22", "where": "main text"}, {"page": "Page39", "printed": "4.39", "where": "main text"}, {"page": "Page23", "printed": "4.23", "where": "main text"}, {"page": "Page50", "printed": "4.50", "where": "summary"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "keyIdea": "K4-5", "level": "core", "term": "joint variation", "positive": {"example": "Triangle with area $A$ cm$^2$, base $b$ cm and height $h$ cm: $A = \\frac{1}{2}bh$", "why": "One constant times the product $bh$.", "source": "book (P.4.22)"}, "negative": {"example": "Tickets: $C$ dollars for $a$ adult tickets at 50 dollars each and $c$ child tickets at 30 dollars each, so $C = 50a + 30c$", "why": "A sum of two parts with two constants, so it is a partial variation.", "source": "authored"}, "check": {"pages": ["4.22", "4.23", "4.39", "4.50"], "date": "2026-10-06", "result": "fixed", "notes": "(scope) 'varies directly as the product' narrows the book's 'varies with the product'; p.4.23 and p.4.50 say a joint variation may also involve inverse variations.; (modality) 'is called joint variation' turns the book's 'is also an example of joint variation' into a full definition.; (condition) 'If $z = kxy$' drops 'where $k$ is a non-zero constant' (with $k = 0$, $z = 0$ is not a variation). | final: (context) The positive example $A = \\frac{1}{2}bh$ and the authored negative $C = 50a + 30c$ use letters that are never introduced, and the negative's 50 and 30 need a real-life reason.; (sources, record only) The sentence 'A joint variation may also involve inverse variations' comes from P.4.23 and P.4.50, which are not in the sources.", "final": "fixed", "confirmed": "2026-10-06 (after fix)"}, "negative.example": "Tickets: $T$ dollars for $m$ adult tickets at 50 dollars each and $n$ child tickets at 30 dollars each, so $T = 50m + 30n$", "parent": null, "role": null, "short": "Joint variation", "treeOrder": 24}, {"id": "S5C4-044", "section": "4.2 A", "sectionTitle": "Joint Variations", "kind": "notation", "title": "Symbols and wordings for joint variation", "statement": "'$A$ varies jointly as $b$ and $h$' is written $A \\propto bh$. It can also be said as '$A$ varies directly as $bh$' or '$A$ varies as $b$ and $h$'.", "example": "'$u$ varies as $v$ and $\\sqrt{w}$': $u = kv\\sqrt{w}$.", "sources": [{"page": "Page22", "printed": "4.22", "where": "main text"}, {"page": "Page22", "printed": "4.22", "where": "margin note"}, {"page": "Page23", "printed": "4.23", "where": "teacher note"}, {"page": "Page24", "printed": "4.24", "where": "exercise"}, {"page": "Page41", "printed": "4.41", "where": "note"}, {"page": "Page50", "printed": "4.50", "where": "summary"}, {"page": "Page73", "printed": "T4.68e", "where": "example"}, {"page": "Page77", "printed": "T4.68i", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "keyIdea": "K4-5", "level": "core", "check": {"pages": ["4.22", "4.23", "4.24", "4.41", "4.50", "T4.68e", "T4.68i"], "date": "2026-10-06", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "S5C4-043", "role": "notation", "short": "$A \\propto bh$ and its wordings", "treeOrder": 25}, {"id": "S5C4-045", "section": "4.2 A", "sectionTitle": "Joint Variations", "kind": "property", "title": "Joint variation: direct, inverse or both", "statement": "A joint variation may involve direct variations ==only==, inverse variations only, or both, always with one ==non-zero== constant $k$.", "sources": [{"page": "Page23", "printed": "4.23", "where": "main text"}, {"page": "Page24", "printed": "4.24", "where": "example"}, {"page": "Page50", "printed": "4.50", "where": "summary"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "keyIdea": "K4-5", "level": "core", "visual": {"type": "table", "head": "row", "rows": [["Words", "Equation"], ["$z$ varies jointly as $x$ and $y$", "$z = kxy$"], ["$z$ varies directly as $x$ and inversely as $y$", "$z = \\frac{kx}{y}$"], ["$z$ varies inversely as the product of $x$ and $y$", "$z = \\frac{k}{xy}$"]], "words": true}, "check": {"pages": ["4.23", "4.24", "4.50"], "date": "2026-10-06", "result": "fixed", "notes": "(condition) 'one constant $k$' drops 'non-zero'; every book example says 'where $k$ is a non-zero constant'.", "final": "pass"}, "parent": "S5C4-043", "role": "extends", "short": "Direct, inverse or both", "treeOrder": 28}, {"id": "S5C4-046", "section": "4.2 A", "sectionTitle": "Joint Variations", "kind": "wording", "title": "Reading joint-variation statements as equations", "statement": "Each joint-variation statement gives one equation with one ==non-zero== variation constant $k$. Quantities after '*varies directly as*', '*varies jointly as*' or just '*varies as*' go in the numerator with $k$, and quantities after '*inversely as*' go in the denominator.", "example": "'$p$ varies directly as $q^3$ and inversely as $r^2$': $p = \\frac{kq^3}{r^2}$.", "sources": [{"page": "Page23", "printed": "4.23", "where": "activity"}, {"page": "Page23", "printed": "4.23", "where": "teacher note"}, {"page": "Page41", "printed": "4.41", "where": "example"}, {"page": "Page41", "printed": "4.41", "where": "note"}, {"page": "Page50", "printed": "4.50", "where": "summary"}, {"page": "Page73", "printed": "T4.68e", "where": "example"}, {"page": "Page74", "printed": "T4.68f", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "inferred": "The numerator and denominator rule is my summary of the Quick Quiz 4.1 answers and the summary examples on P.4.50. Teacher note N7 says only that there are different ways to describe a joint variation.", "keyIdea": "K4-5", "level": "core", "check": {"pages": ["4.23", "4.41", "4.50", "T4.68e", "T4.68f"], "date": "2026-10-06", "result": "fixed", "notes": "(ambiguous) 'Variables it varies directly or jointly as': 'it' grammatically points to 'statement', not to the varying variable.; (condition) 'one constant $k$' drops 'non-zero'; Quick Quiz 4.1 says 'with $k$ as a non-zero variation constant'.; (scope) The rule speaks of 'variables' and only of 'directly or jointly'. It misreads Ex 4C Q10 'z varies jointly as $\\frac{1}{x}$ and $y^2$' (a student may put $x$ on top) and does not cover the plain 'varies as' wording of N8. The book gives no on-top/underneath rule at all; it only lists the equations (marked as inferred on the card).", "final": "pass"}, "parent": "S5C4-044", "role": "wording", "short": "From words to an equation", "treeOrder": 26}, {"id": "S5C4-047", "section": "4.2 A", "sectionTitle": "Joint Variations", "kind": "method-idea", "title": "Percentage change when two variables change", "statement": "When several variables change at once, write each new value as a multiple of its old value and substitute them all. Then compare the new value of the quantity with the old one.", "example": "$x = \\frac{ky^2}{z}$, $y$ down 10%, $z$ up 50%: the new $x$ is $\\frac{k(0.9y)^2}{1.5z} = 0.54 \\times$ the old $x$, a decrease of 46%.", "sources": [{"page": "Page25", "printed": "4.25", "where": "example"}, {"page": "Page25", "printed": "4.25", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-7", "level": "core", "check": {"pages": ["4.25"], "date": "2026-10-06", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "S5C4-024", "role": "extends", "short": "Several variables change", "treeOrder": 40}, {"id": "S5C4-048", "section": "4.2 A", "sectionTitle": "Joint Variations", "kind": "method-idea", "title": "Testing whether an expression is constant", "statement": "Substitute the variation equation into the expression and simplify. If ==only== $k$ is left (such as $k$ or $\\frac{1}{k}$), it must be a constant; if variables are left, it ==may not== be.", "example": "$z = \\frac{kx^2}{y}$: $\\frac{x^2}{yz} = \\frac{1}{k}$ is a constant, but $\\frac{x^2z}{y} = \\frac{kx^4}{y^2}$ ==may not== be.", "sources": [{"page": "Page26", "printed": "4.26", "where": "example"}, {"page": "Page61", "printed": "4.61", "where": "DSE support"}, {"page": "Page74", "printed": "T4.68f", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The general rule is my summary of Example 12. The DSE support page P.4.61 shows the same method as an alternative way to answer an MC question.", "keyIdea": "K4-9", "level": "core", "check": {"pages": ["4.26", "4.61", "T4.68f"], "date": "2026-10-06", "result": "equivalent", "notes": "", "final": "pass"}, "parent": null, "role": null, "short": "Test an expression", "treeOrder": 49, "cluster": "Must it be constant?"}, {"id": "S5C4-049", "section": "4.2 A", "sectionTitle": "Joint Variations", "kind": "property", "title": "Two 'when fixed' results make one joint variation", "statement": "'When $z$ is fixed, $x \\propto y$' and 'when $y$ is fixed, $x \\propto \\frac{1}{\\sqrt{z}}$' combine into one joint variation, $x = \\frac{ky}{\\sqrt{z}}$. This is the reverse of fixing one variable.", "sources": [{"page": "Page28", "printed": "4.28", "where": "exercise"}, {"page": "Page54", "printed": "4.54", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The book tests this in an exercise but does not state it in the text. The sources are Exercise 4C Q13 on P.4.28 and Supplementary Exercise 4 Q24 on P.4.54. The link to the triangle-area cases is my reading.", "keyIdea": "K4-5", "level": "supporting", "check": {"pages": ["4.28", "4.54"], "date": "2026-10-06", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "S5C4-042", "role": "reverse", "short": "Two 'when fixed' results", "treeOrder": 30}, {"id": "S5C4-050", "section": "4.2 B", "sectionTitle": "Partial Variations", "kind": "definition", "title": "Partial variation", "statement": "When a variable is the __sum__ of two or more different parts, where one part ==may== be a constant and the other part(s) may vary directly or inversely as other variable(s), the relation is a **partial variation**.", "sources": [{"page": "Page30", "printed": "4.30", "where": "main text"}, {"page": "Page39", "printed": "4.39", "where": "main text"}, {"page": "Page50", "printed": "4.50", "where": "summary"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "keyIdea": "K4-6", "level": "core", "term": "partial variation", "positive": {"example": "Phone bill: $B$ dollars for $m$ minutes of calls, with a fixed fee of 100 dollars plus 0.5 dollars per minute, so $B = 100 + 0.5m$", "why": "A ==non-zero== constant part, 100, plus a part that varies directly as $m$, with non-zero constant 0.5.", "source": "authored"}, "negative": {"example": "Rectangle with area $A$ cm$^2$, length $l$ cm and width $w$ cm: $A = lw$", "why": "One constant ($k = 1$) times the product $lw$, not a sum of parts, so it is a joint variation.", "source": "authored"}, "watchOut": "Use a separate symbol for each variation constant, as in $y = k_1 + k_2x$, where $k_1$ and $k_2$ are ==non-zero== constants; the values of $k_1$ and $k_2$ may be different, but they ==need not== be.", "check": {"pages": ["4.30", "4.39", "4.50"], "date": "2026-10-06", "result": "fixed", "notes": "(scope) Drops 'different' from 'two or more different parts', so a sum like $k_1x + k_2x$ (really one direct variation) would seem to count.; (modality) 'the others vary directly or inversely' drops the book's 'the other part(s) may vary'.; (ambiguous) watchOut 'Each part has its own non-zero constant' can be read as 'the constants must have different values'. The book says to use different symbols (N9) and that the constants 'may be different' (Note, p.4.31). P.4.53 Q15 gives $y = 2x + 2x^2$, where they are equal. | final: (context) The authored examples $B = 100 + 0.5m$ and $A = lw$ use letters that are never introduced, and the 100 and 0.5 need a real-life reason.; (unmarked) The watch-out's 'but they need not be' is not in the book: the Note on P.4.31 says only that the constants may be different. Equal constants appear in Supplementary Exercise 4 Q15 (P.4.53). The card has no inferr", "final": "fixed", "confirmed": "2026-10-06 (after fix)"}, "inferred": "The positive and negative examples are authored. In the watch-out, 'but they need not be' is added to the Note on P.4.31: Supplementary Exercise 4 Q15 on P.4.53 has $y = 2x + 2x^2$, where both constants are 2.", "parent": null, "role": null, "short": "Partial variation", "treeOrder": 31}, {"id": "S5C4-051", "section": "4.2 B", "sectionTitle": "Partial Variations", "kind": "wording", "title": "Reading partial-variation statements as equations", "statement": "A partial variation is written as a sum of parts, using a separate symbol ($k_1$, $k_2$) for each ==non-zero== variation constant. Its wording ==may== be '*partly … and partly …*', '*the sum of two parts*', '*consists of two parts*' or '*one part … and the other part …*'.", "sources": [{"page": "Page31", "printed": "4.31", "where": "main text"}, {"page": "Page31", "printed": "4.31", "where": "activity"}, {"page": "Page35", "printed": "4.35", "where": "exercise"}, {"page": "Page36", "printed": "4.36", "where": "exercise"}, {"page": "Page42", "printed": "4.42", "where": "example"}, {"page": "Page43", "printed": "4.43", "where": "example"}, {"page": "Page50", "printed": "4.50", "where": "summary"}, {"page": "Page60", "printed": "4.60", "where": "DSE support"}, {"page": "Page75", "printed": "T4.68g", "where": "example"}, {"page": "Page78", "printed": "T4.68j", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "keyIdea": "K4-6", "level": "core", "visual": {"type": "table", "head": "row", "rows": [["Words", "Equation"], ["partly constant and partly varies directly as $x$", "$z = k_1 + k_2x$"], ["partly constant and partly varies inversely as $x$", "$z = k_1 + \\frac{k_2}{x}$"], ["partly varies directly as $x$ and partly directly as $y$", "$z = k_1x + k_2y$"], ["partly varies directly as $x$ and partly inversely as $y$", "$z = k_1x + \\frac{k_2}{y}$"], ["partly varies directly as $x$ and partly directly as $x^2$", "$z = k_1x + k_2x^2$"]], "words": true}, "check": {"pages": ["4.31", "4.35", "4.36", "4.42", "4.43", "4.50", "4.60", "T4.68g", "T4.68j"], "date": "2026-10-06", "result": "fixed", "notes": "(scope) 'Its wording says …' reads as a complete list, but the book also uses 'One part of m is a constant and the other part varies …' (QQ 4.2 Q2, Ex 4D Q2–3) and 'divided into two parts' (T4.68j).; (condition) 'a separate constant for each part' drops 'non-zero' (the table on p.4.31 says $k_1$ and $k_2$ are non-zero constants).; (ambiguous) Table row 5 switches to $h$ and $t$, and the words name no $h$, so the row does not match its own wording. The book's row (e) is z partly varies directly as x and partly directly as x², giving $z = k_1x + k_2x^2$.", "final": "pass"}, "parent": "S5C4-050", "role": "wording", "short": "From words to an equation", "treeOrder": 32}, {"id": "S5C4-052", "section": "4.2 B", "sectionTitle": "Partial Variations", "kind": "common-mistake", "title": "Use two different symbols for the constants", "statement": "Use two different __symbols__, such as $k_1$ and $k_2$, for the variation constants of a partial variation, because their values ==may== be different. So $z = k + kx$ and $z = kx + ky$ are wrong set-ups, even if the values found later turn out equal.", "sources": [{"page": "Page31", "printed": "4.31", "where": "margin note"}, {"page": "Page31", "printed": "4.31", "where": "teacher note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-6", "level": "core", "check": {"pages": ["4.31"], "date": "2026-10-06", "result": "fixed", "notes": "(ambiguous) '$z = kx + ky$ is wrong' can be read as 'the two constants can never be equal'. The book's reason is that the constants may be different (Note, p.4.31), and P.4.53 Q15 has $y = 2x + 2x^2$. The card should state the reason and say that only the set-up is wrong. | final: (unmarked) Two parts of the statement are not in the book and have no inferred note: the reason 'because their values may be different' joins teacher note N9 to the Note on P.4.31, which the book does not link; and 'even if the values found later turn out equal' is added (equal constants occur in Supplementary Exercise 4 Q15, P.4.53).", "final": "fixed", "confirmed": "2026-10-06"}, "inferred": "Teacher note N9 (P.4.31) says to use two different symbols for the two variation constants. The reason 'because their values may be different' is my link to the Note on P.4.31; the book does not join the two with 'because'. The words 'even if the values found later turn out equal' are added: Supplementary Exercise 4 Q15 on P.4.53 has $y = 2x + 2x^2$, where both constants are 2.", "parent": "S5C4-051", "role": "warning", "short": "Two symbols, $k_1$ and $k_2$", "treeOrder": 33}, {"id": "S5C4-053", "section": "4.2 B", "sectionTitle": "Partial Variations", "kind": "property", "title": "Partial variation constants may differ", "statement": "The constants of a partial variation __may be different__, so $z = k_1x + k_2y$ with $k_1 \\neq k_2$ ==can e restriction, that given value is impossible.", "example": "Printing $n$ copies costs $C$ dollars per copy, with $C = 50 + \\frac{1000}{n}$: $C = 80$ gives $n = 33\\frac{1}{3}$, not a positive integer, so a cost of 80 dollars per copy is impossible.", "sources": [{"page": "Page42", "printed": "4.42", "where": "example"}, {"page": "Page78", "printed": "T4.68j", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-8", "level": "supporting", "check": {"pages": ["4.42", "T4.68j"], "date": "2026-10-06", "result": "fixed", "notes": "(ambiguous) 'the situation is impossible' can be read as 'the whole problem is invalid'. The book's conclusion is narrower: the given value (a cost of 80 dollars per copy) cannot happen. | final: (context) The example uses $C$ and $n$ without saying what they are, and '$C = 80$ gives $n = 33\\frac{1}{3}$' needs the relation $C = 50 + \\frac{1000}{n}$, which the card never gives (Example 19, P.4.42).", "final": "fixed", "confirmed": "2026-10-06"}, "parent": "S5C4-062", "role": "warning", "short": "Real-life limits", "treeOrder": 46}, {"id": "S5C4-065", "section": "4.3", "sectionTitle": "Real-life Applications of Variations", "kind": "method-idea", "title": "Find the maximum by completing the square", "statement": "If a height $h$ is given in terms of the time $t$ by $h = k_1t + k_2t^2$ with ==$k_2 < 0$==, complete the square to find the greatest value of $h$. Compare this greatest value with a stated height to decide whether $h$ can exceed that height.", "example": "Javelin $h$ m above its starting position $t$ s after the throw, with $h = 25t - 5t^2$: can $h$ exceed 32 m? $h = -5(t - 2.5)^2 + 31.25$, so the maximum is 31.25 m, which is less than 32 m, so $h$ ==cannot== exceed 32 m.", "sources": [{"page": "Page43", "printed": "4.43", "where": "example"}, {"page": "Page43", "printed": "4.43", "where": "margin note"}, {"page": "Page78", "printed": "T4.68j", "where": "example"}], "teacherOnly": fa function secKey(s) {
  s = String(s || "");
  // Opener first, numbered sections next, end matter (summary, highlight, DSE support) last.
  const group = /^opener/i.test(s) ? "0" : /^\d/.test(s) ? "1" : "2";
  return group + s.split(/[\s.]+/).map(t => /^\d+$/.test(t) ? t.padStart(4, "0") : t).join(".");
}
function inSummary(c) {
  if (typeof c.inSummary === "boolean") return c.inSummary;
  return (c.sources || []).some(s => s.where === "summary");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function richHTML(text) {
  const maths = [];
  let t = String(text || "").replace(/\$[^$]*\$/g, m => { maths.push(m); return "\u0000" + (maths.length - 1) + "\u0000"; });
  t = t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  t = t.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
       .replace(/==(.+?)==/g, "<mark>$1</mark>")
       .replace(/__(.+?)__/g, "<u>$1</u>")
       .replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, "$1<em>$2</em>");
  t = t.replace(/(^|[\s(>])((?:[A-Za-z\d]|\u0000\d+\u0000)+(?:-[A-Za-z]+)+)/g, '$1<span class="nw">$2</span>');
  return t.replace(/\u0000(\d+)\u0000/g, (_, i) => maths[+i].replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"));
}
function rich(tag, cls, text) {

    }

  };
  let lastCluster;
  let ol = null;
  tree.roots.forEach(r => {
    if (r.c.cluster !== lastCluster || !ol) {
      if (r.c.cluster) rail.appendChild(el("div", "cluster-label", r.c.cluster));
      ol = el("ol", "tree");
      rail.appendChild(ol);
      lastCluster = r.c.cluster;
    }

  });
  const checking = state.cardCheck && state.cardCheck.id === item.c.id;
  const foot = checking ? null : railRefreshEl(DATA[state.ch], k, tree);
