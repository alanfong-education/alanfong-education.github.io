f $y=\\log_2 x$ is below the $x$-axis between $x=0$ and $x=1$, and above it for $x>1$.", "sources": [{"page": "Page006", "printed": "3.6", "where": "teacher note"}, {"page": "Page007", "printed": "3.7", "where": "teacher note"}], "teacherOnly": true, "nonFoundation": true, "inSummary": false, "inferred": "The note (N4) is printed on page 3.6 and marked beside the graph of $y=\\log_2 x$ on page 3.7; the sentence linking it to the graph is mine.", "keyIdea": "K3-4", "level": "extra", "hidden": true, "hiddenWhy": "A teacher-note detail that the graph card already shows (where the graph sits above or below a line)."}, {"id": "S5C3-041", "section": "3.1 A", "sectionTitle": "Common Functions and Their Graphs", "kind": "property", "title": "Sign of log_a x when 0<a<1", "statement": "For $0<a<1$: if $0<x<1$, then $\\log_a x$ is positive; if $x>1$, then $\\log_a x$ is negative.", "example": "The graph of $y=\\log_{\\frac{1}{2}} x$ is above the $x$-axis between $x=0$ and $x=1$, and below it for $x>1$.", "sources": [{"page": "Page006", "printed": "3.6", "where": "teacher note"}, {"page": "Page007", "printed": "3.7", "where": "teacher note"}], "teacherOnly": true, "nonFoundation": true, "inSummary": false, "inferred": "The note (N5) is printed on page 3.6 and marked beside the graph of $y=\\log_{\\frac{1}{2}} x$ on page 3.7; the sentence linking it to the graph is mine.", "keyIdea": "K3-4", "level": "extra", "hidden": true, "hiddenWhy": "A teacher-note detail that the graph card already shows (where the graph sits above or below a line)."}, {"id": "S5C3-042", "section": "3.1 A", "sectionTitle": "Common Functions and Their Graphs", "kind": "graph-feature", "title": "$\\log_a x$ and $\\log_{\\frac{1}{a}} x$: mirrored in the $x$-axis", "statement": "The graphs of $y = \\log_a x$ and $y = \\log_{\\frac{1}{a}} x$ are the reflection images of each other with respect to the $x$-axis.", "example": "$y = \\log_2 x$ and $y = \\log_{\\frac{1}{2}} x$.", "sources": [{"page": "Page007", "printed": "3.7", "where": "main text"}, {"page": "Page009", "printed": "3.9", "where": "main text"}, {"page": "Page067", "printed": "3.67", "where": "summary"}], "teacherOnly": false, "nonFoundation": true, "inSummary": true, "keyIdea": "K3-4", "level": "supporting", "visual": {"type": "plot", "x": [-0.8, 5], "y": [-3, 3], "curves": [{"f": "Math.log(x)/Math.log(2)", "style": "main", "dom": [0.02, 5], "label": "$y = \\log_2 x$", "lx": 4.2, "ly": 2.07, "pos": "above"}, {"f": "Math.log(x)/Math.log(0.5)", "style": "main", "dom": [0.02, 5], "label": "$y = \\log_{\\frac{1}{2}} x$", "lx": 4.2, "ly": -2.07, "pos": "below"}]}, "parent": "S5C3-037", "role": "contrast", "short": "Mirror: $\\log_{\\frac{1}{a}} x$", "treeOrder": 27, "cluster": "Logarithmic"}, {"id": "S5C3-043", "section": "3.1 A", "sectionTitle": "Common Functions and Their Graphs", "kind": "link", "title": "Four features for comparing graphs", "statement": "The graphs of the common functions are compared by their domains, whether they have a maximum or a minimum value, their symmetry and their period.", "sources": [{"page": "Page008", "printed": "3.8", "where": "main text"}, {"page": "Page066", "printed": "3.66", "where": "summary"}, {"page": "Page093", "printed": "T3.92a", "where": "teacher note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "inferred": "Part B took this from the teacher's Chapter Highlight (T3.92a), but the same sentence is printed in the main text on P.3.8.", "keyIdea": "K3-1", "level": "supporting", "visual": {"type": "table", "head": "both", "rows": [["", "Domain", "Maximum and minimum", "Period"], ["$y = c$", "all real numbers", "both are $c$", "none"], ["$y = mx + c$", "all real numbers", "neither", "none"], ["$y = a(x - h)^2 + k$", "all real numbers", "one of them, $k$", "none"], ["$y = \\sin x$, $y = \\cos x$", "all angles", "$1$ and $-1$", "$360^\\circ$"], ["$y = \\tan x$", "all angles except $\\pm 90^\\circ, \\pm 270^\\circ, \\dots$", "neither", "$180^\\circ$"]], "words": true}, "parent": null, "role": null, "short": "Four features to compare", "treeOrder": 0, "cluster": "What to compare"}, {"id": "S5C3-044", "section": "3.1 A", "sectionTitle": "Common Functions and Their Graphs", "kind": "property", "title": "Constant function: domain, maximum and minimum", "statement": "The domain of a constant function $y = c$ is all real numbers. Its maximum value and minimum value are equal: both are $c$.", "sources": [{"page": "Page008", "printed": "3.8", "where": "main text"}, {"page": "Page066", "printed": "3.66", "where": "summary"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "keyIdea": "K3-1", "level": "core", "visual": {"type": "plot", "x": [-3, 3], "y": [-1, 3], "curves": [{"f": "2", "style": "main", "label": "$y = 2$", "lx": 1.6, "ly": 2, "pos": "above"}]}, "parent": "S5C3-012", "role": "property", "short": "Maximum and minimum both $c$", "treeOrder": 3, "cluster": "Constant function"}, {"id": "S5C3-045", "section": "3.1 A", "sectionTitle": "Common Functions and Their Graphs", "kind": "property", "title": "Linear function: no maximum or minimum", "statement": "The domain of a linear function is all real numbers. A linear function has no maximum value and no minimum value.", "sources": [{"page": "Page008", "printed": "3.8", "where": "main text"}, {"page": "Page066", "printed": "3.66", "where": "summary"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "keyIdea": "K3-1", "level": "core", "visual": {"type": "plot", "x": [-3, 3], "y": [-3, 4], "curves": [{"f": "x+1", "style": "main", "label": "$y = x + 1$", "lx": 2.2, "ly": 3.2, "pos": "left"}]}, "parent": "S5C3-014", "role": "property", "short": "No maximum or minimum", "treeOrder": 6, "cluster": "Linear function"}, {"id": "S5C3-046", "section": "3.1 A", "sectionTitle": "Common Functions and Their Graphs", "kind": "graph-feature", "title": "$a^x$ and $\\log_a x$: mirrored in $y = x$", "statement": "The graphs of $y = a^x$ and $y = \\log_a x$ are the reflection images of each other with respect to the straight line $y = x$.", "example": "$y = 2^x$ and $y = \\log_2 x$.", "sources": [{"page": "Page009", "printed": "3.9", "where": "main text"}, {"page": "Page014", "printed": "3.14", "where": "exercise"}, {"page": "Page067", "printed": "3.67", "where": "summary"}], "teacherOnly": false, "nonFoundation": true, "inSummary": true, "keyIdea": "K3-4", "level": "core", "visual": {"type": "plot", "x": [-3, 4.5], "y": [-3, 4.5], "curves": [{"f": "x", "style": "dashed", "label": "$y = x$", "lx": 3.8, "ly": 3.8, "pos": "right"}, {"f": "Math.pow(2,x)", "style": "main", "label": "$y = 2^x$", "lx": 1.9, "ly": 3.73, "pos": "left"}, {"f": "Math.log(x)/Math.log(2)", "style": "main", "dom": [0.02, 4.5], "label": "$y = \\log_2 x$", "lx": 4.0, "ly": 2.0, "pos": "below"}]}, "parent": "S5C3-035", "role": "contrast", "short": "Mirror of $a^x$ in $y = x$", "treeOrder": 28, "cluster": "Logarithmic"}, {"id": "S5C3-047", "section": "3.1 A", "sectionTitle": "Common Functions and Their Graphs", "kind": "condition", "title": "The domain when none is stated", "statement": "In this chapter, if the domain of a function is not stated, it is all the values of the independent variable for which the function is defined.", "sources": [{"page": "Page009", "printed": "3.9", "where": "note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K3-1", "level": "supporting", "example": "$y = \\tan x$ is not defined at $x = 90^\\circ$, so $90^\\circ$ is not in its domain.", "parent": "S5C3-043", "role": "condition", "short": "Domain when none is stated", "treeOrder": 1, "cluster": "What to compare"}, {"id": "S5C3-048", "section": "3.1 B", "sectionTitle": "Common Functions and Their Graphs", "kind": "property", "title": "Straight-line graphs versus curved graphs", "statement": "The graphs of constant functions and linear functions are straight lines, which are easy to sketch. The graphs of quadratic, trigonometric, exponential and logarithmic functions are curves, so they are sketched from their features.", "sources": [{"page": "Page010", "printed": "3.10", "where": "main text"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K3-1", "level": "supporting", "hidden": true, "hiddenWhy": "Basic: that lines are easy to draw and curves are sketched from features."}, {"id": "S5C3-049", "section": "3.1 B", "sectionTitle": "Common Functions and Their Graphs", "kind": "method-idea", "title": "Features that fix a parabola sketch", "statement": "To sketch a quadratic graph, first find the axis of symmetry and the vertex. Then find the $y$-intercept and the discriminant $\\Delta$; the $x$-intercept(s) are found only if $\\Delta\\geq 0$. A parabola is then drawn through these points, symmetric about the axis.", "example": "$y=(x-3)^2-4$: axis of symmetry $x=3$, vertex $(3, -4)$, $y$-intercept 5, $x$-intercepts 1 and 5.", "figure": "An upward-opening parabola with a dashed vertical axis $x=3$, lowest point $(3, -4)$, crossing the $x$-axis at 1 and 5 and the $y$-axis at 5.", "sources": [{"page": "Page010", "printed": "3.10", "where": "example"}, {"page": "Page011", "printed": "3.11", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The link between $\\Delta\\geq 0$ and the graph meeting the $x$-axis is not explained on these pages; the book only says to find the $x$-intercept(s) if $\\Delta\\geq 0$. Class Practice 3.1 Q3 adds a first step for a function not yet in the form $y=a(x-h)^2+k$ (rewrite it in that form); that item carries the scissors mark, so the step is not part of the statement.", "keyIdea": "K3-2", "level": "supporting", "hidden": true, "hiddenWhy": "A sketching method, not a knowledge point; kept for the drill guide's recall line."}, {"id": "S5C3-050", "section": "3.1 B", "sectionTitle": "Common Functions and Their Graphs", "kind": "method-idea", "title": "Sketching a trigonometric graph", "statement": "To sketch a trigonometric graph over a given interval, mark the points where the graph cuts the $x$-axis, mark the maximum and minimum points, and then sketch a curve passing through all the marked points.", "example": "For $y=\\sin x$ with $0^\\circ\\leq x\\leq 360^\\circ$: it cuts the $x$-axis at $0^\\circ$, $180^\\circ$ and $360^\\circ$, has maximum point $(90^\\circ, 1)$ and minimum point $(270^\\circ, -1)$.", "sources": [{"page": "Page010", "printed": "3.10", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K3-3", "level": "supporting", "hidden": true, "hiddenWhy": "A sketching method, not a knowledge point; kept for the drill guide's recall line."}, {"id": "S5C3-051", "section": "3.1 B", "sectionTitle": "Common Functions and Their Graphs", "kind": "method-idea", "title": "Sketching an exponential graph", "statement": "To sketch the graph of an exponential function $y=a^x$, first decide from $a$ whether the graph slopes upwards or downwards from left to right. Then sketch a curve passing through $(0, 1)$ and lying above the $x$-axis.", "example": "$y=3^x$ slopes upwards, passes through $(0, 1)$ and stays above the $x$-axis.", "sources": [{"page": "Page011", "printed": "3.11", "where": "exercise"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "keyIdea": "K3-4", "level": "supporting", "hidden": true, "hiddenWhy": "A sketching method, not a knowledge point; kept for the drill guide's recall line."}, {"id": "S5C3-052", "section": "3.1 B", "sectionTitle": "Common Functions and Their Graphs", "kind": "method-idea", "title": "Sketching a logarithmic graph", "statement": "To sketch the graph of a logarithmic function $y=\\log_a x$, first decide from $a$ whether the graph slopes upwards or downwards from left to right. Then sketch a curve passing through $(1, 0)$ and lying on the right of the $y$-axis.", "example": "$y=\\log_4 x$ slopes upwards, passes through $(1, 0)$ and stays to the right of the $y$-axis.", "sources": [{"page": "Page011", "printed": "3.11", "where": "exercise"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "keyIdea": "K3-4", "level": "supporting", "hidden": true, "hiddenWhy": "A sketching method, not a knowledge point; kept for the drill guide's recall line."}, {"id": "S5C3-053", "section": "3.2", "sectionTitle": "Solving Equations by Using Graphs of Functions", "kind": "link", "title": "Roots are x-intercepts (Book 4A)", "statement": "In Book 4A Chapter 3, the roots of the quadratic equation $ax^2+bx+c=0$ were found by reading the $x$-intercepts of the graph of $y=ax^2+bx+c$. In other words, the $x$-coordinates of the points of intersection of the graphs of $y=ax^2+bx+c$ and $y=0$ are the roots of $ax^2+bx+c=0$.", "figure": "An upward-opening parabola $y=ax^2+bx+c$ crossing the $x$-axis (drawn as the line $y=0$) at $x_1$ and $x_2$, with arrows labelling them 'roots of $ax^2+bx+c=0$'.", "sources": [{"page": "Page015", "printed": "3.15", "where": "main text"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K3-5", "level": "supporting", "hidden": true, "hiddenWhy": "Taught in an earlier chapter; this chapter's general card (with y = k) covers it."}, {"id": "S5C3-054", "section": "3.2", "sectionTitle": "Solving Equations by Using Graphs of Functions", "kind": "method-idea", "title": "Roots of $f(x) = k$ from a graph", "statement": "The $x$-coordinates of the points of intersection of the graphs of $y = f(x)$ and $y = k$ are the roots of $f(x) = k$. So draw the line $y = k$ and read the $x$-coordinates where it meets the graph.", "example": "$x^2 - 5x + 6 = 2$: the line $y = 2$ meets $y = x^2 - 5x + 6$ at $x = 1$ and $x = 4$, so the roots are 1 and 4.", "sources": [{"page": "Page015", "printed": "3.15", "where": "definition box"}, {"page": "Page015", "printed": "3.15", "where": "main text"}, {"page": "Page016", "printed": "3.16", "where": "example"}, {"page": "Page067", "printed": "3.67", "where": "summary"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "keyIdea": "K3-5", "level": "core", "visual": {"type": "plot", "x": [-0.6, 5.6], "y": [-1, 7.5], "curves": [{"f": "x*x-5*x+6", "style": "main", "label": "$y = x^2 - 5x + 6$", "lx": 5.05, "ly": 6.25, "pos": "left"}, {"f": "2", "style": "dashed", "label": "$y = 2$", "lx": 5.6, "ly": 2, "pos": "above-left"}], "points": [{"x": 1, "y": 2}, {"x": 4, "y": 2}], "segments": [{"x1": 1, "y1": 0, "x2": 1, "y2": 2}, {"x1": 4, "y1": 0, "x2": 4, "y2": 2}], "texts": [{"x": 1, "y": 0, "tex": "$1$", "pos": "below"}, {"x": 4, "y": 0, "tex": "$4$", "pos": "below"}]}, "parent": null, "role": null, "short": "Roots of $f(x) = k$", "treeOrder": 29}, {"id": "S5C3-055", "section": "3.2", "sectionTitle": "Solving Equations by Using Graphs of Functions", "kind": "property", "title": "Graph readings are approximate", "statement": "Results obtained by reading from graphs are approximate values only. Their accuracy depends on the scale of the graph: when each grid on the $x$-axis represents 1, the roots read off are correct to the nearest integer.", "example": "For $x^2-5x+6=2$ on a grid with one unit per square, the roots 1 and 4 are correct to the nearest integer.", "sources": [{"page": "Page015", "printed": "3.15", "where": "note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K3-5", "level": "supporting", "hidden": true, "hiddenWhy": "Exam technique (the accuracy of graph readings), not a knowledge point."}, {"id": "S5C3-056", "section": "3.2", "sectionTitle": "Solving Equations by Using Graphs of Functions", "kind": "property", "title": "No intersection means no real roots", "statement": "If the graphs of $y = f(x)$ and $y = k$ do not intersect, then the equation $f(x) = k$ has no real roots.", "example": "$\\sin x = 1.2$ has no real roots: the line $y = 1.2$ lies above the whole graph of $y = \\sin x$.", "sources": [{"page": "Page015", "printed": "3.15", "where": "note"}, {"page": "Page017", "printed": "3.17", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K3-5", "level": "core", "visual": {"type": "plot", "x": [0, 410], "y": [-1.5, 1.7], "curves": [{"f": "Math.sin(x*Math.PI/180)", "style": "main", "dom": [0, 360], "label": "$y = \\sin x$", "lx": 300, "ly": -0.87, "pos": "below"}, {"f": "1.2", "style": "dashed", "label": "$y = 1.2$", "lx": 410, "ly": 1.2, "pos": "above-left"}], "texts": [{"x": 180, "y": 0, "tex": "$180^\\circ$", "pos": "below"}, {"x": 360, "y": 0, "tex": "$360^\\circ$", "pos": "below"}]}, "parent": "S5C3-054", "role": "warning", "short": "No intersection, no real roots", "treeOrder": 31}, {"id": "S5C3-057", "section": "3.2", "sectionTitle": "Solving Equations by Using Graphs of Functions", "kind": "property", "title": "Axis scales and reading accuracy", "statement": "The scales of the $x$-axis and the $y$-axis are not necessarily the same. When each unit on the $x$-axis has 10 divisions, the values of $x$ read from the graph are correct to the nearest 0.1.", "example": "In Example 2, the roots of $4x^2-4x-2=2$ are read as $-0.6$ and $1.6$.", "sources": [{"page": "Page016", "printed": "3.16", "where": "teacher note"}], "teacherOnly": true, "nonFoundation": false, "inSummary": false, "keyIdea": "K3-5", "level": "extra", "hidden": true, "hiddenWhy": "A teacher note on axis scales and reading accuracy: exam technique."}, {"id": "S5C3-058", "section": "3.2", "sectionTitle": "Solving Equations by Using Graphs of Functions", "kind": "graph-feature", "title": "Counting the roots from a graph", "statement": "The number of roots of $f(x) = k$ is the number of points where the line $y = k$ meets the graph of $y = f(x)$. If the line only touches the graph at one point, such as the vertex of a parabola, there is one root.", "example": "$4x^2 - 4x - 2 = -3$ has one root, 0.5: the line $y = -3$ touches the graph only at its vertex.", "sources": [{"page": "Page016", "printed": "3.16", "where": "example"}, {"page": "Page019", "printed": "3.19", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The book does not state this as a rule. It is read from Example 2(b), where only one root is given, and from Class Practice 3.2 Q1, which asks students to state the number of roots from the figure.", "keyIdea": "K3-5", "level": "core", "visual": {"type": "plot", "x": [-1.3, 2.3], "y": [-4, 4], "curves": [{"f": "4*x*x-4*x-2", "style": "main"}, {"f": "2", "style": "dashed", "label": "$y = 2$: two roots", "lx": 2.3, "ly": 2, "pos": "above-left"}, {"f": "-3", "style": "dashed", "label": "$y = -3$: one root", "lx": 2.3, "ly": -3, "pos": "below-left"}], "points": [{"x": -0.618, "y": 2}, {"x": 1.618, "y": 2}, {"x": 0.5, "y": -3}]}, "parent": "S5C3-054", "role": "property", "short": "Count the intersections", "treeOrder": 30}, {"id": "S5C3-059", "section": "3.2", "sectionTitle": "Solving Equations by Using Graphs of Functions", "kind": "method-idea", "title": "Not only quadratic equations", "statement": "The graphical method is not only for quadratic equations. It also solves trigonometric, cubic, exponential and logarithmic equations, using the graph of the function and a suitable horizontal line.", "example": "For $0^\\circ \\leq x \\leq 360^\\circ$, the line $y = -0.7$ meets $y = \\sin x$ at about $225^\\circ$ and $315^\\circ$.", "sources": [{"page": "Page017", "printed": "3.17", "where": "main text"}, {"page": "Page017", "printed": "3.17", "where": "example"}, {"page": "Page018", "printed": "3.18", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K3-5", "level": "supporting", "parent": "S5C3-054", "role": "extends", "short": "Not only quadratic equations", "treeOrder": 32}, {"id": "S5C3-060", "section": "3.2", "sectionTitle": "Solving Equations by Using Graphs of Functions", "kind": "method-idea", "title": "Rewrite to match the given graph", "statement": "When the given graph is not one side of the equation, rewrite the equation as (the given function) $=$ (a constant), then draw the straight line $y =$ (that constant). Inequalities are rewritten in the same way.", "example": "Given the graph of $y = x^3 + x^2$: rewrite $x^3 + x^2 + 1 = 0$ as $x^3 + x^2 = -1$ and draw $y = -1$.", "sources": [{"page": "Page018", "printed": "3.18", "where": "example"}, {"page": "Page019", "printed": "3.19", "where": "exercise"}, {"page": "Page027", "printed": "3.27", "where": "example"}, {"page": "Page095", "printed": "T3.92c", "where": "example"}, {"page": "Page098", "printed": "T3.92f", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K3-5", "level": "core", "parent": "S5C3-054", "role": "method", "short": "Rewrite to match the graph", "treeOrder": 33}, {"id": "S5C3-061", "section": "3.2", "sectionTitle": "Solving Equations by Using Graphs of Functions", "kind": "method-idea", "title": "The equation two graphs solve", "statement": "If the graphs of two functions are drawn on the same axes, the $x$-coordinates of their points of intersection are the roots of the equation formed by setting the two functions equal. That equation can be rearranged into equivalent forms.", "example": "The graphs of $y = x^2$ and $y = 5$ solve $x^2 = 5$, that is, $x^2 - 5 = 0$.", "sources": [{"page": "Page019", "printed": "3.19", "where": "exercise"}, {"page": "Page021", "printed": "3.21", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "Stated only through Exercise 3B Q8 and the Exercise 3B objective 'Write down an equation that can be solved by using the graphs of two functions'; the general wording is mine.", "keyIdea": "K3-5", "level": "core", "parent": "S5C3-054", "role": "extends", "short": "Two graphs: $f(x) = g(x)$", "treeOrder": 34}, {"id": "S5C3-062", "section": "3.3", "sectionTitle": "Solving Inequalities by Using Graphs of Functions", "kind": "link", "title": "Quadratic inequalities by graph (Book 5A)", "statement": "In Book 5A Chapter 2, the graph of $y=ax^2+bx+c$ was used to solve the quadratic inequalities $ax^2+bx+c>0$ and $ax^2+bx+c<0$.", "sources": [{"page": "Page023", "printed": "3.23", "where": "main text"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K3-6", "level": "supporting", "hidden": true, "hiddenWhy": "Taught in an earlier chapter; this chapter's general card (with y = k) covers it."}, {"id": "S5C3-063", "section": "3.3", "sectionTitle": "Solving Inequalities by Using Graphs of Functions", "kind": "graph-feature", "title": "ax^2+bx+c > 0: graph above x-axis", "statement": "The solutions of $ax^2+bx+c>0$ are the values of $x$ for which the graph of $y=ax^2+bx+c$ is above the straight line $y=0$. For the upward-opening graph in the book, with $x$-intercepts $m$ and $n$, the solutions are $x<m$ or $x>n$.", "example": "For $y=x^2-3x-4$, with $x$-intercepts $-1$ and $4$, the solutions of $x^2-3x-4>0$ are $x<-1$ or $x>4$ (teacher note).", "figure": "Fig. 1: an upward-opening parabola cutting the $x$-axis (the line $y=0$) at hollow circles $m$ and $n$. The two outer arms, above the axis, are marked '$x<m$' and '$x>n$', with a brace '$y>0$'.", "sources": [{"page": "Page023", "printed": "3.23", "where": "main text"}, {"page": "Page023", "printed": "3.23", "where": "teacher note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The book's general text only says 'where $a\\neq 0$'; the direction of opening and $m<n$ are read from Fig. 1.", "keyIdea": "K3-6", "level": "supporting", "hidden": true, "hiddenWhy": "Taught in an earlier chapter; this chapter's general card (with y = k) covers it."}, {"id": "S5C3-064", "section": "3.3", "sectionTitle": "Solving Inequalities by Using Graphs of Functions", "kind": "graph-feature", "title": "ax^2+bx+c < 0: graph below x-axis", "statement": "The solutions of $ax^2+bx+c<0$ are the values of $x$ for which the graph of $y=ax^2+bx+c$ is below the straight line $y=0$. For the upward-opening graph in the book, with $x$-intercepts $m$ and $n$, the solutions are $m<x<n$.", "example": "For $y=x^2-3x-4$, the solutions of $x^2-3x-4<0$ are $-1<x<4$ (teacher note).", "figure": "Fig. 2: the same upward-opening parabola; the part between $m$ and $n$, below the $x$-axis, is highlighted and marked '$m<x<n$', with a brace '$y<0$'.", "sources": [{"page": "Page023", "printed": "3.23", "where": "main text"}, {"page": "Page023", "printed": "3.23", "where": "teacher note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The direction of opening and $m<n$ are read from Fig. 2.", "keyIdea": "K3-6", "level": "supporting", "hidden": true, "hiddenWhy": "Taught in an earlier chapter; this chapter's general card (with y = k) covers it."}, {"id": "S5C3-065", "section": "3.3", "sectionTitle": "Solving Inequalities by Using Graphs of Functions", "kind": "method-idea", "title": "$f(x) > k$: graph above $y = k$", "statement": "The solutions of $f(x) > k$ are the values of $x$ for which the graph of $y = f(x)$ is above the straight line $y = k$. Here $f(x)$ is not limited to quadratic polynomials.", "example": "$x^2 - 5x + 6 > 2$: the graph is above $y = 2$ when $x < 1$ or $x > 4$.", "sources": [{"page": "Page023", "printed": "3.23", "where": "definition box"}, {"page": "Page023", "printed": "3.23", "where": "margin note"}, {"page": "Page024", "printed": "3.24", "where": "main text"}, {"page": "Page025", "printed": "3.25", "where": "example"}, {"page": "Page028", "printed": "3.28", "where": "example"}, {"page": "Page067", "printed": "3.67", "where": "summary"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "keyIdea": "K3-6", "level": "core", "visual": {"type": "plot", "x": [-0.6, 5.6], "y": [-1, 7.5], "curves": [{"f": "x*x-5*x+6", "style": "main", "dom": [-0.6, 1]}, {"f": "x*x-5*x+6", "style": "main", "dom": [4, 5.6]}, {"f": "x*x-5*x+6", "style": "muted", "dom": [1, 4]}, {"f": "2", "style": "dashed", "label": "$y = 2$", "lx": 2.5, "ly": 2, "pos": "above"}], "points": [{"x": 1, "y": 2, "hollow": true}, {"x": 4, "y": 2, "hollow": true}], "segments": [{"x1": 1, "y1": 0, "x2": 1, "y2": 2}, {"x1": 4, "y1": 0, "x2": 4, "y2": 2}], "texts": [{"x": 1, "y": 0, "tex": "$1$", "pos": "below"}, {"x": 4, "y": 0, "tex": "$4$", "pos": "below"}, {"x": 0.1, "y": 4.8, "tex": "$x < 1$", "pos": "left"}, {"x": 4.9, "y": 4.8, "tex": "$x > 4$", "pos": "right"}]}, "parent": null, "role": null, "short": "$f(x) > k$: above $y = k$", "treeOrder": 35, "cluster": "Above or below the line"}, {"id": "S5C3-066", "section": "3.3", "sectionTitle": "Solving Inequalities by Using Graphs of Functions", "kind": "method-idea", "title": "$f(x) < k$: graph below $y = k$", "statement": "The solutions of $f(x) < k$ are the values of $x$ for which the graph of $y = f(x)$ is below the straight line $y = k$. Here $f(x)$ is not limited to quadratic polynomials.", "example": "$x^2 - 5x + 6 < 2$: the graph is below $y = 2$ when $1 < x < 4$.", "sources": [{"page": "Page023", "printed": "3.23", "where": "definition box"}, {"page": "Page023", "printed": "3.23", "where": "margin note"}, {"page": "Page024", "printed": "3.24", "where": "main text"}, {"page": "Page026", "printed": "3.26", "where": "example"}, {"page": "Page067", "printed": "3.67", "where": "summary"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "keyIdea": "K3-6", "level": "core", "visual": {"type": "plot", "x": [-0.6, 5.6], "y": [-1.7, 7.5], "curves": [{"f": "x*x-5*x+6", "style": "main", "dom": [1, 4]}, {"f": "x*x-5*x+6", "style": "muted", "dom": [-0.6, 1]}, {"f": "x*x-5*x+6", "style": "muted", "dom": [4, 5.6]}, {"f": "2", "style": "dashed", "label": "$y = 2$", "lx": 5.6, "ly": 2, "pos": "above-left"}], "points": [{"x": 1, "y": 2, "hollow": true}, {"x": 4, "y": 2, "hollow": true}], "segments": [{"x1": 1, "y1": 0, "x2": 1, "y2": 2}, {"x1": 4, "y1": 0, "x2": 4, "y2": 2}], "texts": [{"x": 1, "y": 0, "tex": "$1$", "pos": "below"}, {"x": 4, "y": 0, "tex": "$4$", "pos": "below"}, {"x": 2.5, "y": -0.35, "tex": "$1 < x < 4$", "pos": "below"}]}, "parent": "S5C3-065", "role": "contrast", "short": "$f(x) < k$: below $y = k$", "treeOrder": 36, "cluster": "Above or below the line"}, {"id": "S5C3-067", "section": "3.3", "sectionTitle": "Solving Inequalities by Using Graphs of Functions", "kind": "graph-feature", "title": "Hollow circles and filled dots", "statement": "In the book's figures, a hollow circle marks a point of intersection that is not part of the solutions ($>$ or $<$), and a filled dot marks one that is ($\\geq$ or $\\leq$).", "example": "$x^2 - 5x + 6 < 2$ has hollow circles at $x = 1$ and $x = 4$; $x^2 - 5x + 6 \\leq 2$ has filled dots there.", "sources": [{"page": "Page023", "printed": "3.23", "where": "main text"}, {"page": "Page024", "printed": "3.24", "where": "margin note"}, {"page": "Page025", "printed": "3.25", "where": "example"}, {"page": "Page026", "printed": "3.26", "where": "example"}, {"page": "Page067", "printed": "3.67", "where": "summary"}, {"page": "Page096", "printed": "T3.92d", "where": "example"}, {"page": "Page097", "printed": "T3.92e", "where": "example"}, {"page": "Page099", "printed": "T3.92g", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "inferred": "The book never states this convention in words; it is read from the figures (Fig. 1 and 2, the margin figure for $x^2-5x+6\\leq 2$, and Examples 5 and 6).", "keyIdea": "K3-6", "level": "supporting", "parent": "S5C3-068", "role": "notation", "short": "Hollow circle or filled dot", "treeOrder": 38, "cluster": "Above or below the line"}, {"id": "S5C3-068", "section": "3.3", "sectionTitle": "Solving Inequalities by Using Graphs of Functions", "kind": "condition", "title": "$\\geq$ and $\\leq$ include the intersections", "statement": "When the inequality sign is $\\geq$ or $\\leq$, the solutions include the $x$-coordinates of the points of intersection of the graphs of $y = f(x)$ and $y = k$.", "example": "$x^2 - 5x + 6 \\leq 2$: the solutions are $1 \\leq x \\leq 4$, with $x = 1$ and $x = 4$ included.", "sources": [{"page": "Page024", "printed": "3.24", "where": "note"}, {"page": "Page024", "printed": "3.24", "where": "margin note"}, {"page": "Page025", "printed": "3.25", "where": "example"}, {"page": "Page067", "printed": "3.67", "where": "summary"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "keyIdea": "K3-6", "level": "core", "parent": "S5C3-065", "role": "condition", "short": "$\\geq$ and $\\leq$ include them", "treeOrder": 37, "cluster": "Above or below the line"}, {"id": "S5C3-069", "section": "3.3", "sectionTitle": "Solving Inequalities by Using Graphs of Functions", "kind": "property", "title": "When there are no solutions", "statement": "If the graph of $y = f(x)$ is never above the line $y = k$, then $f(x) > k$ has no solutions. Likewise, if it is never below the line, $f(x) < k$ has no solutions.", "example": "$\\sin x > 1.5$ has no solutions: the line $y = 1.5$ lies above the whole graph of $y = \\sin x$.", "sources": [{"page": "Page026", "printed": "3.26", "where": "example"}, {"page": "Page032", "printed": "3.32", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The book shows this with examples only; the general sentence is mine.", "keyIdea": "K3-6", "level": "supporting", "parent": null, "role": null, "short": "No solutions", "treeOrder": 39, "cluster": "All or nothing"}, {"id": "S5C3-070", "section": "3.3", "sectionTitle": "Solving Inequalities by Using Graphs of Functions", "kind": "property", "title": "When every $x$ is a solution", "statement": "If the whole graph of $y = f(x)$ over the given range of $x$ satisfies the inequality, then every value of $x$ in that range is a solution.", "example": "$\\sin x \\leq 1.5$ for $0^\\circ \\leq x \\leq 360^\\circ$: the solutions are $0^\\circ \\leq x \\leq 360^\\circ$.", "sources": [{"page": "Page026", "printed": "3.26", "where": "example"}, {"page": "Page031", "printed": "3.31", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The book shows this with examples only; the general sentence is mine.", "keyIdea": "K3-6", "level": "supporting", "parent": null, "role": null, "short": "Every $x$ is a solution", "treeOrder": 40, "cluster": "All or nothing"}, {"id": "S5C3-071", "section": "3.3", "sectionTitle": "Solving Inequalities by Using Graphs of Functions", "kind": "condition", "title": "Solutions stay inside the given range", "statement": "When the graph is drawn only for a given range of $x$, the solutions must lie in that range. The ends of the given range can be part of the solutions.", "example": "$\\sin x < 0.5$ for $0^\\circ \\leq x \\leq 360^\\circ$: $0^\\circ \\leq x < 30^\\circ$ or $150^\\circ < x \\leq 360^\\circ$.", "sources": [{"page": "Page026", "printed": "3.26", "where": "example"}, {"page": "Page030", "printed": "3.30", "where": "exercise"}, {"page": "Page031", "printed": "3.31", "where": "exercise"}, {"page": "Page096", "printed": "T3.92d", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The general sentence is mine, drawn from Example 6(a) and Exercise 3C Q4 and Q5 (graphs with $0<x\\leq k$ and $h\\leq x\\leq k$).", "keyIdea": "K3-6", "level": "core", "visual": {"type": "plot", "x": [0, 410], "y": [-1.5, 1.5], "curves": [{"f": "Math.sin(x*Math.PI/180)", "style": "main", "dom": [0, 30]}, {"f": "Math.sin(x*Math.PI/180)", "style": "main", "dom": [150, 360]}, {"f": "Math.sin(x*Math.PI/180)", "style": "muted", "dom": [30, 150]}, {"f": "0.5", "style": "dashed", "label": "$y = 0.5$", "lx": 410, "ly": 0.5, "pos": "above-left"}], "points": [{"x": 30, "y": 0.5, "hollow": true}, {"x": 150, "y": 0.5, "hollow": true}, {"x": 0, "y": 0}, {"x": 360, "y": 0}], "texts": [{"x": 30, "y": 0, "tex": "$30^\\circ$", "pos": "below"}, {"x": 150, "y": 0, "tex": "$150^\\circ$", "pos": "below"}, {"x": 360, "y": 0, "tex": "$360^\\circ$", "pos": "below"}]}, "parent": null, "role": null, "short": "Inside the given range", "treeOrder": 41, "cluster": "Limits on $x$"}, {"id": "S5C3-072", "section": "3.3", "sectionTitle": "Solving Inequalities by Using Graphs of Functions", "kind": "condition", "title": "Logarithmic inequality: $x$ stays positive", "statement": "The graph of $y = \\log_a x$ lies on the right of the $y$-axis, so the solutions of a logarithmic inequality can only contain positive values of $x$.", "example": "$\\log_5 x \\leq 0.25$: the solutions are $0 < x \\leq 1.5$, not $x \\leq 1.5$.", "sources": [{"page": "Page027", "printed": "3.27", "where": "example"}, {"page": "Page097", "printed": "T3.92e", "where": "example"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "keyIdea": "K3-6", "level": "core", "parent": null, "role": null, "short": "Logarithm: $x$ stays positive", "treeOrder": 42, "cluster": "Limits on $x$"}, {"id": "S5C3-073", "section": "3.3", "sectionTitle": "Solving Inequalities by Using Graphs of Functions", "kind": "condition", "title": "The situation limits the solutions", "statement": "In an application problem, the situation itself restricts the values of $x$. The solutions read from the graph must also satisfy these restrictions.", "example": "Squares of side $x$ cm are cut from the corners of a 6 cm by 4 cm card to make a box, so $0 < x < 2$.", "figure": "The cubic graph of $y=V(x)$ for $x\\geq 0$: it rises to a peak between $x=0$ and $x=1$, falls to cut the $x$-axis at 2, dips below the axis and rises again after cutting it at 3. The line $y=5$ cuts the hump at about $x=0.3$ and $x=1.4$ (hollow circles); the brace '$y>5$ (for $0<x<2$)' marks only the hump.", "sources": [{"page": "Page028", "printed": "3.28", "where": "example"}, {"page": "Page099", "printed": "T3.92g", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K3-6", "level": "supporting", "parent": null, "role": null, "short": "The situation limits $x$", "treeOrder": 43, "cluster": "Limits on $x$"}, {"id": "S5C3-074", "section": "3.3", "sectionTitle": "Solving Inequalities by Using Graphs of Functions", "kind": "method-idea", "title": "Double inequality: use two horizontal lines", "statement": "To solve a double inequality such as $2.6 < \\left(\\frac{1}{5}\\right)^x \\le 3.6$, add both straight lines $y = 2.6$ and $y = 3.6$ to the figure and find the $x$-values where the graph lies between them. Here the solutions are $-0.8 \\le x < -0.6$.", "figure": "A falling exponential curve $y = \\left(\\frac{1}{5}\\right)^x$ meeting $y = 3.6$ at a filled dot above $x = -0.8$ and meeting $y = 2.6$ at an open circle above $x = -0.6$.", "sources": [{"page": "Page097", "printed": "T3.92e", "where": "example"}], "teacherOnly": true, "nonFoundation": true, "inSummary": false, "inferred": "No main-text example in 3.3 uses a double inequality; it appears only in the teacher's Supplementary Example 6(a). Because the graph is falling, the line y = 3.6 gives the left end of the solution; this is our reading of the figure.", "keyIdea": "K3-6", "level": "extra", "hidden": true, "hiddenWhy": "A teacher-only supplementary example, not in the students' book; it extends f(x) > k and f(x) < k."}, {"id": "S5C3-075", "section": "3.4", "sectionTitle": "Transformations of Functions", "kind": "link", "title": "Transforming points transforms graphs", "statement": "The graph of a function is made up of points. So the translations and reflections of points learnt in junior forms can also be applied to functions.", "sources": [{"page": "Page035", "printed": "3.35", "where": "main text"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "keyIdea": "K3-7", "level": "supporting", "parent": null, "role": null, "short": "Graphs are made of points", "treeOrder": 44}, {"id": "S5C3-076", "section": "3.4", "sectionTitle": "Transformations of Functions", "kind": "notation", "title": "Green arrows in this chapter's figures", "statement": "In this chapter, a green arrow in a figure shows how one specific point on the graph of a function is moved by a transformation.", "sources": [{"page": "Page037", "printed": "3.37", "where": "margin note"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "keyIdea": "K3-7", "level": "extra", "hidden": true, "hiddenWhy": "A convention of the book's printing, not a knowledge point."}, {"id": "S5C3-077", "section": "3.4", "sectionTitle": "Transformations of Functions", "kind": "property", "title": "Each result also works backwards", "statement": "Every transformation result in this section has a true converse. For example, if $g(x) = f(x) + k$ with $k > 0$, then the graph of $y = g(x)$ is the graph of $y = f(x)$ translated upwards by $k$ units.", "sources": [{"page": "Page037", "printed": "3.37", "where": "note"}, {"page": "Page040", "printed": "3.40", "where": "note"}, {"page": "Page044", "printed": "3.44", "where": "note"}, {"page": "Page048", "printed": "3.48", "where": "note"}, {"page": "Page052", "printed": "3.52", "where": "note"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "keyIdea": "K3-7", "level": "core", "parent": "S5C3-075", "role": "reverse", "short": "Each result works backwards", "treeOrder": 45}, {"id": "S5C3-078", "section": "3.4", "sectionTitle": "Transformations of Functions", "kind": "method-idea", "title": "Write $g(x)$ in terms of $f(x)$", "statement": "To describe how the graph of $y = f(x)$ is transformed into the graph of $y = g(x)$, rewrite $g(x)$ in terms of $f(x)$, such as $f(x) + 7$, $f(x - 6)$, $-f(x)$ or $f(-x)$. The form names the transformation.", "example": "$f(x) = x^2 + 1$ and $g(x) = x^2 + 8 = f(x) + 7$: translated upwards by 7 units.", "sources": [{"page": "Page041", "printed": "3.41", "where": "example"}, {"page": "Page045", "printed": "3.45", "where": "example"}, {"page": "Page100", "printed": "T3.92h", "where": "example"}, {"page": "Page101", "printed": "T3.92i", "where": "example"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "keyIdea": "K3-7", "level": "core", "parent": "S5C3-077", "role": "method", "short": "Write $g(x)$ using $f(x)$", "treeOrder": 46}, {"id": "S5C3-079", "section": "3.4 A", "sectionTitle": "Transformations of Functions", "kind": "property", "title": "Upwards by $k$: $f(x) + k$", "statement": "If the graph of $y = f(x)$ is translated upwards by $k$ units ($k > 0$), the function of the new graph is $y = f(x) + k$. Each point keeps its $x$-coordinate, and its $y$-coordinate increases by $k$.", "example": "$f(x) = x^2$ moved upwards by 3 units: $(-2, 4)$ goes to $(-2, 7)$, and $g(x) = f(x) + 3$.", "sources": [{"page": "Page035", "printed": "3.35", "where": "main text"}, {"page": "Page037", "printed": "3.37", "where": "definition box"}, {"page": "Page055", "printed": "3.55", "where": "activity"}, {"page": "Page068", "printed": "3.68", "where": "summary"}], "teacherOnly": false, "nonFoundation": true, "inSummary": true, "keyIdea": "K3-8", "level": "core", "visual": {"type": "plot", "x": [-3.6, 3.4], "y": [-1, 9], "curves": [{"f": "x*x", "style": "muted", "label": "$y = f(x)$", "lx": -1.8, "ly": 3.24, "pos": "left"}, {"f": "x*x+3", "style": "main", "label": "$y = f(x) + 3$", "lx": 1.9, "ly": 6.61, "pos": "left"}], "points": [{"x": -2, "y": 4, "hollow": true}, {"x": -2, "y": 7}], "segments": [{"x1": -2, "y1": 4, "x2": -2, "y2": 7}]}, "parent": "S5C3-081", "role": "property", "short": "Up: $f(x) + k$", "treeOrder": 49}, {"id": "S5C3-080", "section": "3.4 A", "sectionTitle": "Transformations of Functions", "kind": "property", "title": "Downwards by $k$: $f(x) - k$", "statement": "If the graph of $y = f(x)$ is translated downwards by $k$ units ($k > 0$), the function of the new graph is $y = f(x) - k$. Each point keeps its $x$-coordinate, and its $y$-coordinate decreases by $k$.", "example": "$f(x) = x^2$ moved downwards by 4 units: $(-2, 4)$ goes to $(-2, 0)$, and $h(x) = f(x) - 4$.", "sources": [{"page": "Page036", "printed": "3.36", "where": "main text"}, {"page": "Page037", "printed": "3.37", "where": "definition box"}, {"page": "Page055", "printed": "3.55", "where": "activity"}, {"page": "Page068", "printed": "3.68", "where": "summary"}], "teacherOnly": false, "nonFoundation": true, "inSummary": true, "keyIdea": "K3-8", "level": "core", "visual": {"type": "plot", "x": [-3.5, 3.5], "y": [-5, 6], "curves": [{"f": "x*x", "style": "muted", "label": "$y = f(x)$", "lx": 2.3, "ly": 5.29, "pos": "left"}, {"f": "x*x-4", "style": "main", "label": "$y = f(x) - 4$", "lx": 0, "ly": -4, "pos": "right"}], "points": [{"x": -2, "y": 4, "hollow": true}, {"x": -2, "y": 0}], "segments": [{"x1": -2, "y1": 0, "x2": -2, "y2": 4}]}, "parent": "S5C3-081", "role": "property", "short": "Down: $f(x) - k$", "treeOrder": 50}, {"id": "S5C3-081", "section": "3.4 A", "sectionTitle": "Transformations of Functions", "kind": "wording", "title": "Vertical and horizontal translation", "statement": "Translating a graph upwards or downwards, $f(x) \\to f(x) \\pm k$, is called vertical translation. Translating it to the left or right, $f(x) \\to f(x \\pm k)$, is called horizontal translation.", "sources": [{"page": "Page037", "printed": "3.37", "where": "note"}, {"page": "Page040", "printed": "3.40", "where": "note"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "keyIdea": "K3-8", "level": "supporting", "term": "vertical translation", "positive": {"example": "$y = f(x) + 3$", "why": "3 is added to the value of the function, so the graph moves upwards by 3 units.", "source": "authored"}, "negative": {"example": "$y = f(x + 3)$", "why": "3 is added to $x$ inside $f$: a horizontal translation, to the left by 3 units.", "source": "authored"}, "parent": null, "role": null, "short": "Vertical or horizontal", "treeOrder": 48}, {"id": "S5C3-082", "section": "3.4 A", "sectionTitle": "Transformations of Functions", "kind": "property", "title": "A translation keeps the shape", "statement": "The graphs of $y = f(x) \\pm k$ and $y = f(x \\pm k)$ have the same shape as the graph of $y = f(x)$. A translation only moves the graph.", "sources": [{"page": "Page037", "printed": "3.37", "where": "note"}, {"page": "Page040", "printed": "3.40", "where": "note"}, {"page": "Page069", "printed": "3.69", "where": "exercise"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "inferred": "Checkpoint Q6 (P.3.69, scissors-marked) tests this point; the printed answer on P.3.91 marks the claim that a translation changes the shape as wrong.", "keyIdea": "K3-8", "level": "supporting", "parent": "S5C3-081", "role": "property", "short": "Same shape", "treeOrder": 54}, {"id": "S5C3-083", "section": "3.4 A", "sectionTitle": "Transformations of Functions", "kind": "method-idea", "title": "Track one point", "statement": "To find the function after a translation, follow one marked point from the original graph to the new graph. Its movement gives the direction and the number of units.", "example": "$(0, -2)$ on $y = x^2 + x - 2$ moves to $(0, -1)$: upwards by 1 unit, so $g(x) = f(x) + 1$.", "sources": [{"page": "Page037", "printed": "3.37", "where": "example"}, {"page": "Page040", "printed": "3.40", "where": "example"}, {"page": "Page041", "printed": "3.41", "where": "exercise"}, {"page": "Page100", "printed": "T3.92h", "where": "example"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "inferred": "The book does this in Examples 9 and 10 and Instant Drill 10 without stating it as a general method; the general wording is mine.", "keyIdea": "K3-7", "level": "supporting", "parent": "S5C3-075", "role": "method", "short": "Track one point", "treeOrder": 47}, {"id": "S5C3-084", "section": "3.4 A", "sectionTitle": "Transformations of Functions", "kind": "property", "title": "To the left by $k$: $f(x + k)$", "statement": "If the graph of $y = f(x)$ is translated to the left by $k$ units ($k > 0$), the function of the new graph is $y = f(x + k)$. Each point keeps its $y$-coordinate, and its $x$-coordinate decreases by $k$.", "example": "$f(x) = x^2$ moved to the left by 2 units: $(0, 0)$ goes to $(-2, 0)$, and $g(x) = f(x + 2)$.", "sources": [{"page": "Page038", "printed": "3.38", "where": "main text"}, {"page": "Page040", "printed": "3.40", "where": "definition box"}, {"page": "Page055", "printed": "3.55", "where": "activity"}, {"page": "Page068", "printed": "3.68", "where": "summary"}], "teacherOnly": false, "nonFoundation": true, "inSummary": true, "keyIdea": "K3-8", "level": "core", "visual": {"type": "plot", "x": [-4.6, 3.0], "y": [-1.4, 6], "curves": [{"f": "x*x", "style": "muted", "label": "$y = f(x)$", "lx": 1.3, "ly": 1.69, "pos": "right"}, {"f": "(x+2)*(x+2)", "style": "main", "label": "$y = f(x + 2)$", "lx": -2, "ly": 0, "pos": "below"}], "points": [{"x": 0, "y": 0, "hollow": true}, {"x": -2, "y": 0}], "segments": [{"x1": -2, "y1": 0, "x2": 0, "y2": 0}], "origin": false}, "parent": "S5C3-081", "role": "property", "short": "Left: $f(x + k)$", "treeOrder": 51}, {"id": "S5C3-085", "section": "3.4 A", "sectionTitle": "Transformations of Functions", "kind": "method-idea", "title": "Why left gives $f(x + 2)$", "statement": "After a translation to the left by 2 units, the new graph at $x$ has the height that the original graph has at $x + 2$. So $g(x) = f(x + 2)$, and in the same way a translation to the right by 2 units gives $f(x - 2)$.", "sources": [{"page": "Page038", "printed": "3.38", "where": "teacher note"}], "teacherOnly": true, "nonFoundation": true, "inSummary": false, "keyIdea": "K3-8", "level": "extra", "parent": "S5C3-084", "role": "warning", "short": "Why left gives $x + 2$", "treeOrder": 52}, {"id": "S5C3-086", "section": "3.4 A", "sectionTitle": "Transformations of Functions", "kind": "property", "title": "To the right by $k$: $f(x - k)$", "statement": "If the graph of $y = f(x)$ is translated to the right by $k$ units ($k > 0$), the function of the new graph is $y = f(x - k)$. Each point keeps its $y$-coordinate, and its $x$-coordinate increases by $k$.", "example": "$f(x) = x^2$ moved to the right by 2 units: $(0, 0)$ goes to $(2, 0)$, and $h(x) = f(x - 2)$.", "sources": [{"page": "Page039", "printed": "3.39", "where": "main text"}, {"page": "Page040", "printed": "3.40", "where": "definition box"}, {"page": "Page055", "printed": "3.55", "where": "activity"}, {"page": "Page068", "printed": "3.68", "where": "summary"}], "teacherOnly": false, "nonFoundation": true, "inSummary": true, "keyIdea": "K3-8", "level": "core", "visual": {"type": "plot", "x": [-3.0, 4.6], "y": [-1.4, 6], "curves": [{"f": "x*x", "style": "muted", "label": "$y = f(x)$", "lx": -1.3, "ly": 1.69, "pos": "left"}, {"f": "(x-2)*(x-2)", "style": "main", "label": "$y = f(x - 2)$", "lx": 2, "ly": 0, "pos": "below"}], "points": [{"x": 0, "y": 0, "hollow": true}, {"x": 2, "y": 0}], "segments": [{"x1": 0, "y1": 0, "x2": 2, "y2": 0}], "origin": false}, "parent": "S5C3-081", "role": "property", "short": "Right: $f(x - k)$", "treeOrder": 53}, {"id": "S5C3-087", "section": "3.4 A", "sectionTitle": "Transformations of Functions", "kind": "link", "title": "Sine moved left 90° gives cosine", "statement": "If the graph of $y=f(x)=\\sin x$ is translated to the left by $90^\\circ$, the graph of $y=\\cos x$ is obtained, because $f(x+90^\\circ)=\\sin(x+90^\\circ)=\\cos x$.", "figure": "The sine curve and the cosine curve on the same axes from $-90^\\circ$ to $360^\\circ$, with arrows showing each part of the sine curve moving $90^\\circ$ to the left onto the cosine curve.", "sources": [{"page": "Page040", "printed": "3.40", "where": "teacher note"}], "teacherOnly": true, "nonFoundation": true, "inSummary": false, "keyIdea": "K3-8", "level": "extra", "hidden": true, "hiddenWhy": "A teacher-note extra (sine moved left 90° gives cosine), beyond the revision focus."}, {"id": "S5C3-088", "section": "3.4 A", "sectionTitle": "Transformations of Functions", "kind": "property", "title": "Translation and the maximum or minimum", "statement": "Translating the graph of a quadratic function to the left or right does not change its maximum or minimum value. Translating it upwards increases the value, and translating it downwards decreases it.", "example": "$y = x^2$ moved upwards by 3 units: the minimum value changes from 0 to 3.", "sources": [{"page": "Page076", "printed": "3.76", "where": "exercise"}, {"page": "Page092", "printed": "3.92", "where": "exercise"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "inferred": "The book tests this in Supplementary Exercise 3 Q33(c) (scissors-marked) but does not state it in the text. The answer is printed on P.3.92 as well as in magenta on P.3.76, so the card is not teacher-only. The example is our reading of the figures on P.3.35 and P.3.38; that the value changes by the number of units translated is our reasoning, not the book's.", "keyIdea": "K3-8", "level": "supporting", "parent": "S5C3-081", "role": "consequence", "short": "Maximum or minimum after moving", "treeOrder": 55}, {"id": "S5C3-089", "section": "3.4 B", "sectionTitle": "Transformations of Functions", "kind": "property", "title": "Reflect in the $x$-axis: $-f(x)$", "statement": "If the graph of $y = f(x)$ is reflected with respect to the $x$-axis, the function of the new graph is $y = -f(x)$. Each point keeps its $x$-coordinate, and its $y$-coordinate is multiplied by $-1$.", "example": "$f(x) = x - 1$: $(3, 2)$ goes to $(3, -2)$, and $g(x) = -f(x)$.", "sources": [{"page": "Page042", "printed": "3.42", "where": "main text"}, {"page": "Page044", "printed": "3.44", "where": "definition box"}, {"page": "Page055", "printed": "3.55", "where": "activity"}, {"page": "Page068", "printed": "3.68", "where": "summary"}], "teacherOnly": false, "nonFoundation": true, "inSummary": true, "keyIdea": "K3-9", "level": "core", "visual": {"type": "plot", "
